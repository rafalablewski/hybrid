<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Data Viz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{--ink:#0c0d0c;--ink2:#141614;--card:#161816;--line:#2a2d2a;--lime:#c4f035;--chalk:#f3f4ef;--ash:#8b8f86;--blue:#7fd4e8;--violet:#c9a9f0;--amber:#f0b45e;--red:#e0625e;--green:#7fe0a0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Archivo',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
.phone{--fg:var(--chalk);width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;color:var(--fg);background:radial-gradient(120% 60% at 80% 0,#13170f,#080a08 55%)}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:40;font-family:'JetBrains Mono';font-size:14px;font-weight:500;color:var(--fg)}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--fg);opacity:.22;z-index:40}
.logo{font-weight:900;font-size:14px;letter-spacing:.3em}
.kicker{font-family:'JetBrains Mono';font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.statlabel{font-family:'Archivo Narrow';font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);display:block;margin-top:4px}
.primary{width:100%;border:none;border-radius:14px;padding:16px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--lime);color:var(--ink);box-shadow:0 14px 36px -12px rgba(196,240,53,.45)}
.srow{display:flex;gap:10px;margin-top:10px}
.srow button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:14px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
.done{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ash);font-family:'JetBrains Mono';font-size:12px;padding:14px 0 0;cursor:pointer}
/* —— dataviz layout —— */
.wrap{position:absolute;inset:0;padding:64px 28px 30px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.date{font-family:'JetBrains Mono';font-size:11px;color:var(--ash);letter-spacing:.08em}
.kicker{margin-top:26px}
.h1{font-weight:900;font-size:30px;letter-spacing:-.03em;margin-top:6px}
.hero{margin-top:8px;display:flex;align-items:baseline;gap:10px}
.hero b{font-weight:900;font-size:74px;letter-spacing:-.04em;line-height:1}
.hero small{font-weight:700;font-size:24px;color:var(--ash)}
.up{font-family:'JetBrains Mono';font-size:12px;color:var(--green);background:rgba(127,224,160,.12);border:1px solid rgba(127,224,160,.3);padding:4px 9px;border-radius:999px;align-self:center}
.chart{flex:1;margin-top:18px;display:flex;align-items:flex-end;gap:9px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.bar{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#26301a,#1a2113);position:relative}
.bar.on{background:linear-gradient(180deg,#d6ff5e,var(--lime));box-shadow:0 0 24px -4px rgba(196,240,53,.6)}
.bar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:'JetBrains Mono';font-size:9px;color:var(--ash)}
.bar.on span{color:var(--lime)}
.axis{display:flex;gap:9px;margin-top:8px}
.axis div{flex:1;text-align:center;font-family:'JetBrains Mono';font-size:9px;color:var(--ash);letter-spacing:.04em}
.foot{display:flex;margin-top:18px;border-top:1px solid var(--line)}
.stat{flex:1;padding:16px 2px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-weight:900;font-size:24px}
.actions{margin-top:18px}
</style></head>
<body><div class="phone">
  <div class="statusbar"><span class="time">22:41</span><span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="date">22 JUN · 22:41</div></div>
    <div class="kicker">Session complete</div>
    <div class="h1">Night workout</div>
    <div class="hero"><b>20.0</b><small>t volume</small><span class="up">▲ new high</span></div>
    <div class="chart">
      <div class="bar" style="height:34%"><span>9t</span></div>
      <div class="bar" style="height:50%"><span>13t</span></div>
      <div class="bar" style="height:42%"><span>11t</span></div>
      <div class="bar" style="height:64%"><span>16t</span></div>
      <div class="bar" style="height:55%"><span>14t</span></div>
      <div class="bar" style="height:70%"><span>17t</span></div>
      <div class="bar on" style="height:100%"><span>20t</span></div>
    </div>
    <div class="axis"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Tonight</div></div>
    <div class="foot">
      <div class="stat"><b>1</b><span class="statlabel">Minutes</span></div>
      <div class="stat"><b>2</b><span class="statlabel">Sets</span></div>
      <div class="stat"><b>7</b><span class="statlabel">Day streak</span></div>
    </div>
    <div class="actions">
      <button class="primary">↗ Share to story</button>
      <div class="srow"><button>★ Save as routine</button><button>See analysis →</button></div>
      <button class="done">Done — back to Today</button>
    </div>
  </div>
  <div class="home"></div>
</div></body></html>
