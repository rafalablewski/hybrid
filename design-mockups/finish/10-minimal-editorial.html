<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 10 Minimal Editorial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;800;900&family=Space+Mono:wght@400&display=swap');
:root{--ink:#0b0d0b;--chalk:#f3f5f1;--ash:#7d837c;--lime:#c4f035;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:64px 28px 28px;display:flex;flex-direction:column}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--lime)}
.h1{font-weight:300;font-size:40px;letter-spacing:-.03em;margin-top:10px;line-height:1.02}
.h1 b{font-weight:900}
.name{font-size:15px;color:var(--ash);margin-top:10px}
.rule{height:1px;background:var(--line);margin:28px 0}
.metrics{display:flex;flex-direction:column;gap:0}
.m{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.m .k{font-family:'Space Mono';font-size:12px;letter-spacing:.06em;color:var(--ash)}
.m .v{font-weight:800;font-size:24px}
.m .v small{font-size:13px;color:var(--ash);font-weight:400}
.fun{margin-top:22px;font-weight:300;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.fun b{font-weight:900;color:var(--lime)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:0;padding:18px;font-weight:800;font-size:14px;letter-spacing:.04em;cursor:pointer;font-family:inherit;text-transform:uppercase}
.share{background:var(--lime);color:var(--ink)}
.row{display:flex;justify-content:space-between;margin-top:18px}
.link{background:none;border:none;color:var(--ash);font-family:'Space Mono';font-size:12px;cursor:pointer;letter-spacing:.04em}
.link.hot{color:var(--lime)}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Complete</div>
  <div class="h1">Nicely<br><b>done.</b></div>
  <div class="name">Push Day A — 22 June, 07:42</div>
  <div class="rule"></div>
  <div class="metrics">
    <div class="m"><span class="k">Volume</span><span class="v">4.2 <small>t</small></span></div>
    <div class="m"><span class="k">Sets</span><span class="v">18</span></div>
    <div class="m"><span class="k">Duration</span><span class="v">47 <small>min</small></span></div>
    <div class="m"><span class="k">Records</span><span class="v">2 🏆</span></div>
  </div>
  <div class="fun">You moved <b>4.2 t</b> — about a small car.</div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share</button>
  <div class="row"><button class="link">★ Save routine</button><button class="link hot">Analysis →</button></div>
</div></div></body></html>
