<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 14 Mascot Speech Bubble</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.4px,transparent 1.4px);background-size:16px 16px;pointer-events:none}
.wrap{position:relative;height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);margin-bottom:18px}
.bubble{position:relative;background:var(--chalk);color:var(--ink);border-radius:24px;padding:26px 22px;font-weight:900;font-size:26px;line-height:1.12;letter-spacing:-.01em;box-shadow:0 16px 40px -16px rgba(0,0,0,.6)}
.bubble b{color:#5a7a00}
.bubble:after{content:"";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);border:16px solid transparent;border-top-color:var(--chalk);border-bottom:0}
.mascot{font-size:90px;margin-top:26px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.coach{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:6px}
.stats{display:flex;gap:18px;margin-top:18px;font-family:'Space Mono';font-size:12px;color:var(--ash)}
.stats b{color:var(--chalk);font-family:Archivo;font-size:18px;display:block}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="dots"></div><div class="wrap">
  <div class="tag">Coach says…</div>
  <div class="bubble">That was <b>4.2 t</b> —<br>basically a small car. 🚗<br>Who hurt the iron?</div>
  <div class="mascot">🤖</div>
  <div class="coach">COACH BYTE · Push Day A done</div>
  <div class="stats">
    <div><b>47'</b>time</div><div><b>18</b>sets</div><div><b>2🏆</b>prs</div>
  </div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share what Coach said</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div></body></html>
