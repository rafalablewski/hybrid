<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Rings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{--lime:#c4f035;--blue:#7fd4e8;--violet:#c9a9f0;--chalk:#f4f6f2;--ash:#9aa09a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:radial-gradient(120% 70% at 50% 30%,#16201d 0%,#0a0c0a 60%,#060706 100%)}
.glow{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(196,240,53,.22),transparent 65%);filter:blur(8px)}
.wrap{position:absolute;inset:0;padding:56px 28px 26px;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:.3em;font-size:15px}
.date{font-family:'JetBrains Mono';font-size:11px;color:var(--ash);letter-spacing:.08em}
.kick{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--lime);margin-top:30px}
.h1{font-weight:900;font-size:30px;letter-spacing:-.03em;margin-top:8px}
.rings{position:relative;width:248px;height:248px;margin:26px 0 10px}
.rings svg{transform:rotate(-90deg)}
.rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.rc b{font-weight:900;font-size:62px;letter-spacing:-.04em;line-height:.9}
.rc b small{font-size:24px;color:var(--ash);font-weight:600}
.rc span{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.16em;color:var(--ash);text-transform:uppercase;margin-top:6px;display:block}
.legend{display:flex;gap:22px;margin-top:14px}
.legend div{text-align:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.legend b{font-weight:800;font-size:19px}
.legend b small{font-size:12px;color:var(--ash)}
.legend span{display:block;font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;color:var(--ash);margin-top:3px;text-transform:uppercase}
.spacer{flex:1}
.acts{width:100%}
.share{width:100%;border:none;border-radius:16px;padding:17px;font-family:inherit;font-weight:800;font-size:16px;background:var(--lime);color:#06270a;cursor:pointer;box-shadow:0 14px 40px -10px rgba(196,240,53,.55)}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:16px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--chalk);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--ash);padding:14px 0 0}
</style></head>
<body><div class="phone"><div class="glow"></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="date">22 JUN · 22:41</div></div>
    <div class="kick">Session complete</div>
    <div class="h1">Night workout</div>
    <div class="rings">
      <svg width="248" height="248" viewBox="0 0 248 248">
        <circle cx="124" cy="124" r="112" stroke="rgba(196,240,53,.15)" stroke-width="16" fill="none"/>
        <circle cx="124" cy="124" r="112" stroke="#c4f035" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="703" stroke-dashoffset="120"/>
        <circle cx="124" cy="124" r="88" stroke="rgba(127,212,232,.15)" stroke-width="16" fill="none"/>
        <circle cx="124" cy="124" r="88" stroke="#7fd4e8" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="240"/>
        <circle cx="124" cy="124" r="64" stroke="rgba(201,169,240,.15)" stroke-width="16" fill="none"/>
        <circle cx="124" cy="124" r="64" stroke="#c9a9f0" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="300"/>
      </svg>
      <div class="rc"><div><b>20<small>t</small></b><span>Volume</span></div></div>
    </div>
    <div class="legend">
      <div><b><i style="background:var(--lime)"></i>20.0<small>t</small></b><span>Volume</span></div>
      <div><b><i style="background:var(--blue)"></i>2</b><span>Sets</span></div>
      <div><b><i style="background:var(--violet)"></i>1<small>m</small></b><span>Minutes</span></div>
    </div>
    <div class="spacer"></div>
    <div class="acts">
      <button class="share">↗ Share to story</button>
      <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
    </div>
    <div class="back">Done — back to Today</div>
  </div>
</div></body></html>
