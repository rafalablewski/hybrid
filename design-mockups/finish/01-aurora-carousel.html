<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 01 Aurora Carousel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--ink2:#14181410;--surface:#141814;--line:rgba(255,255,255,.10);--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--blue:#5aa7ff;--violet:#b79cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 120px -30px #000;border:1px solid #222}
.glow{position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(196,240,53,.22),transparent 70%);pointer-events:none}
.glow2{position:absolute;bottom:-160px;left:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(91,167,255,.16),transparent 70%);pointer-events:none}
.wrap{position:relative;height:100%;overflow-y:auto;padding:64px 20px 28px}
.hero{text-align:center;margin-bottom:22px}
.check{width:76px;height:76px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:rgba(196,240,53,.14);border:2px solid var(--lime);font-size:34px;color:var(--lime)}
.h1{font-weight:900;font-size:28px;margin-top:16px;letter-spacing:-.02em}
.name{font-weight:700;font-size:18px;margin-top:6px}
.rename{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:6px}
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:236px}
.ey{font-family:'Space Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.stat-row{display:flex;margin-top:30px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:34px;font-weight:900}
.stat span{font-family:'Space Mono';font-size:10px;letter-spacing:.1em;color:var(--ash)}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0}
.dot{width:7px;height:7px;border-radius:4px;background:var(--line)}
.dot.on{width:20px;background:var(--lime)}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6);margin-top:6px}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4);margin-top:10px}
.analysis{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:24px;font-weight:600}
.back{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ash);font-family:'Space Mono';font-size:13px;padding:16px;cursor:pointer}
</style></head>
<body><div class="phone"><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <div class="hero">
    <div class="check">✓</div>
    <div class="h1">Workout complete</div>
    <div class="name">Push Day A</div>
    <div class="rename">✎ rename</div>
  </div>
  <div class="slides">
    <div class="card">
      <div class="ey">Overview</div>
      <div style="font-weight:800;font-size:20px;margin-top:10px">Push Day A</div>
      <div class="stat-row">
        <div class="stat"><b>47</b><span>MINUTES</span></div>
        <div class="stat"><b>18</b><span>SETS</span></div>
        <div class="stat"><b>4.2 t</b><span>VOLUME</span></div>
      </div>
    </div>
    <div class="card"><div class="ey">Records &amp; bests</div></div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <button class="btn share">↗ Share your win</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
  <button class="back">Done — back to Today</button>
</div></div></body></html>
