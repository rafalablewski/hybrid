<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 17 Did You Know</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--violet:#b79cff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:radial-gradient(circle at 50% 0%,#241d38,transparent 55%),var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.done{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.badge{margin:16px 0 6px;display:inline-block;background:var(--lime);color:var(--ink);font-weight:900;font-size:14px;letter-spacing:.14em;padding:8px 18px;border-radius:999px;transform:rotate(-3deg);box-shadow:0 8px 24px -6px rgba(196,240,53,.6)}
.card{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:24px;padding:30px 22px;margin-top:10px}
.q{font-family:'Space Mono';font-size:12px;color:var(--violet);letter-spacing:.1em;text-transform:uppercase}
.emoji{font-size:80px;margin:14px 0}
.a{font-weight:900;font-size:26px;line-height:1.15}
.a b{color:var(--lime)}
.exp{font-size:13px;color:var(--ash);margin-top:12px;line-height:1.4}
.exp b{color:var(--chalk)}
.stats{display:flex;gap:10px;width:100%;margin-top:16px}
.s{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px 6px}
.s b{display:block;font-size:19px;font-weight:900}.s span{font-family:'Space Mono';font-size:9px;color:var(--ash)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="done">Push Day A · complete ✓</div>
  <div class="badge">★ FUN FACT ★</div>
  <div class="card">
    <div class="q">Did you know?</div>
    <div class="emoji">🐘</div>
    <div class="a">Your 4.2 t today ≈<br>almost an <b>elephant.</b></div>
    <div class="exp">A grown African elephant weighs about <b>5 tonnes</b> — you weren't far off.</div>
  </div>
  <div class="stats">
    <div class="s"><b>47'</b><span>TIME</span></div>
    <div class="s"><b>18</b><span>SETS</span></div>
    <div class="s"><b>2 🏆</b><span>PRS</span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share the fact</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div></body></html>
