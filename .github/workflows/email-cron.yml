name: Email worker (cron)

# The email automation worker (scheduled campaigns, sequence steps, win-back
# enrollment). Vercel's Hobby plan only allows cron jobs to run once per day, so
# instead of a sub-daily entry in vercel.json we trigger the hourly worker from
# GitHub Actions — it just calls the existing CRON_SECRET-protected endpoint.
#
# Setup (one time): add a repo SECRET `CRON_SECRET` (same value as in Vercel) and,
# if the production URL isn't the default below, a repo VARIABLE `APP_URL`.
#   Settings → Secrets and variables → Actions.
# If the project later moves to Vercel Pro, you can delete this workflow and
# re-add { "path": "/api/cron/email", "schedule": "0 * * * *" } to vercel.json.
#
# NOTE: scheduled workflows only run from the DEFAULT branch, so this starts
# firing once the PR is merged to main.

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC)
  workflow_dispatch: {}

# Don't pile up overlapping runs if one is slow.
concurrency:
  group: email-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET secret not set — skipping. Add it (same value as Vercel) under Settings → Secrets and variables → Actions."
            exit 0
          fi
          URL="${APP_URL:-https://hybrid-web-rosy.vercel.app}"
          echo "GET $URL/api/cron/email"
          code=$(curl -sS -m 60 -o /tmp/out -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL/api/cron/email")
          echo "HTTP $code"
          cat /tmp/out 2>/dev/null || true
          echo
          test "$code" = "200"
