<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Professional</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{--ink:#0c0d0c;--ink2:#141614;--card:#161816;--line:#262926;--chalk:#f3f4ef;--ash:#8b8f86;--lime:#c4f035;--blue:#7fd4e8;--green:#7fe0a0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.bar .id{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:rgba(127,224,160,.12);border:1px solid rgba(127,224,160,.3);padding:5px 9px;border-radius:999px}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--green)}
.h1{font-weight:800;font-size:27px;margin-top:20px;letter-spacing:-.02em}
.name{font-size:14px;color:var(--ash);margin-top:5px}
.rename{margin-top:14px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ash);font-family:'JetBrains Mono'}
.metrics{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.m.full{grid-column:1/3}
.m .k{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.m .v{font-weight:800;font-size:30px;margin-top:8px}
.m .v small{font-size:14px;color:var(--ash);font-weight:500}
.m .delta{font-family:'JetBrains Mono';font-size:11px;color:var(--green);margin-top:4px}
.spark{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:12px}
.spark i{flex:1;background:var(--line);border-radius:2px}
.spark i.on{background:var(--lime)}
.dots{display:flex;gap:6px;margin:18px 2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dot.on{width:20px;background:var(--lime)}
.spacer{flex:1;min-height:6px}
.btn{width:100%;border:1px solid var(--line);background:var(--ink2);border-radius:11px;padding:15px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--chalk);margin-top:9px;display:flex;justify-content:center;gap:8px}
.share{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.foot{display:flex;justify-content:space-between;padding-top:16px;margin-top:6px;border-top:1px solid var(--line);font-family:'JetBrains Mono';font-size:11px;color:var(--ash)}
.foot a{color:var(--chalk);text-decoration:none}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="bar"><div class="id"><span style="color:var(--lime)">●</span> HYBRID · SESSION REPORT</div><div class="pill"><span class="d"></span>Saved</div></div>
  <div class="h1">Session complete</div>
  <div class="name">Night workout · 22 Jun 2026, 22:41</div>
  <div class="rename">✎ Name this workout (optional)</div>
  <div class="metrics">
    <div class="m"><div class="k">Duration</div><div class="v">1<small> min</small></div></div>
    <div class="m"><div class="k">Total sets</div><div class="v">2</div></div>
    <div class="m full"><div class="k">Volume moved</div><div class="v">20.0<small> t</small></div><div class="delta">▲ on track vs. last session</div>
      <div class="spark"><i style="height:30%"></i><i style="height:45%"></i><i style="height:38%"></i><i style="height:60%"></i><i style="height:52%"></i><i class="on" style="height:80%"></i></div>
    </div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share to story</button>
  <button class="btn">★ Save as routine</button>
  <button class="btn">See your analysis →</button>
  <div class="foot"><span>DONE — BACK TO TODAY</span><a href="#">Export ↗</a></div>
</div></div></body></html>
