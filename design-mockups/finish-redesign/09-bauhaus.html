<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Bauhaus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{--ink:#0c0d0c;--chalk:#f3f4ef;--paper:#edeae1;--lime:#c4f035;--blue:#7fd4e8;--amber:#f0b45e;--red:#e0625e;--violet:#c9a9f0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#161614;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--ink)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #2a2a27;box-shadow:0 40px 120px -30px #000;background:var(--paper)}
.wrap{height:100%;display:flex;flex-direction:column}
.hd{background:var(--ink);color:var(--chalk);padding:56px 26px 22px;display:flex;align-items:center;justify-content:space-between}
.hd .t{font-family:'Archivo Narrow';font-weight:700;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
.hd .c{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:21px}
.h1{padding:24px 26px 0;font-weight:900;font-size:50px;line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
.name{padding:12px 26px 22px;font-family:'Archivo Narrow';font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.shapes{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:128px 128px;gap:0}
.blk{position:relative;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.blk .n{font-weight:900;font-size:50px;line-height:.85;letter-spacing:-.03em;z-index:2}
.blk .k{font-family:'JetBrains Mono';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.b1{background:var(--lime)}
.b2{background:var(--blue)}
.b3{background:var(--amber);grid-column:1/3}
.b1 .circ{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--ink);opacity:.12}
.b2 .tri{position:absolute;right:-10px;bottom:-20px;width:0;height:0;border-left:70px solid transparent;border-bottom:90px solid rgba(12,13,12,.12)}
.b3 .sq{position:absolute;right:26px;top:-30px;width:120px;height:120px;background:var(--red);transform:rotate(18deg)}
.b3 .big{font-size:72px}
.dots{display:flex;gap:8px;padding:18px 26px;background:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--paper)}
.dot.on{background:var(--lime);border-color:var(--lime)}
.acts{background:var(--ink);padding:0 26px 8px;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;border:2px solid var(--paper);background:transparent;color:var(--chalk);border-radius:0;padding:15px;font-family:'Archivo Narrow';font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left}
.share{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.back{background:var(--ink);color:var(--chalk);text-align:center;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:14px 0 26px;opacity:.6}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="hd"><div class="t">HYBRID · Session</div><div class="c">✓</div></div>
  <div class="h1">Session<br>complete</div>
  <div class="name">Night workout — ✎ name it</div>
  <div class="shapes">
    <div class="blk b1"><div class="circ"></div><div class="k">Minutes</div><div class="n">1</div></div>
    <div class="blk b2"><div class="tri"></div><div class="k">Sets</div><div class="n">2</div></div>
    <div class="blk b3"><div class="sq"></div><div class="k">Volume — tonnes</div><div class="n big">20.0</div></div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="acts">
    <button class="btn share">↗ Share to story</button>
    <button class="btn">★ Save as routine</button>
    <button class="btn">See your analysis →</button>
  </div>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
