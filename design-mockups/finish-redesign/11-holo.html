<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Holo Card</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');
:root{--ink:#0a0c0a;--lime:#c4f035;--chalk:#f4f6f2;--ash:#9aa09a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:radial-gradient(120% 80% at 50% 0,#15110b,#070807 60%)}
.wrap{position:absolute;inset:0;padding:40px 26px 26px;display:flex;flex-direction:column}
.crest{display:flex;justify-content:space-between;align-items:center;color:var(--ash);font-family:'JetBrains Mono';font-size:11px;letter-spacing:.12em}
.crest b{color:var(--chalk);font-weight:900;letter-spacing:.3em}
.card{flex:1;margin-top:16px;border-radius:26px;padding:22px;position:relative;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.35);
  background:
   linear-gradient(125deg,rgba(255,90,200,.35),rgba(127,212,232,.3) 30%,rgba(196,240,53,.4) 55%,rgba(201,169,240,.35) 80%,rgba(255,170,90,.3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 30px 60px -24px #000}
.holo{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.6;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 9px,rgba(255,255,255,.35) 9px 11px,rgba(255,255,255,0) 11px 22px)}
.holo2{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.35;
  background:conic-gradient(from 200deg at 70% 20%,#ff5ac8,#7fd4e8,#c4f035,#c9a9f0,#ff5ac8)}
.glass{position:absolute;inset:0;background:rgba(8,10,8,.34);backdrop-filter:blur(2px)}
.c{position:relative;z-index:3;height:100%;display:flex;flex-direction:column}
.tier{display:inline-flex;align-self:flex-start;gap:7px;align-items:center;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:999px}
.tier i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.name{font-weight:900;font-size:34px;letter-spacing:-.03em;margin-top:16px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.sub{font-family:'JetBrains Mono';font-size:11px;color:rgba(255,255,255,.85);letter-spacing:.06em;margin-top:6px}
.big{font-weight:900;font-size:118px;line-height:.82;letter-spacing:-.05em;margin-top:auto;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.big small{font-weight:700;font-size:38px}
.foot{display:flex;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.4)}
.foot div b{display:block;font-weight:900;font-size:22px}
.foot div span{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.serial{position:absolute;right:18px;bottom:18px;font-family:'JetBrains Mono';font-size:10px;color:rgba(255,255,255,.7);z-index:3}
.acts{margin-top:18px}
.share{width:100%;border:none;border-radius:16px;padding:16px;font-family:inherit;font-weight:800;font-size:16px;background:var(--lime);color:#06270a;cursor:pointer}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:16px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--chalk);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--ash);padding:14px 0 0}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="crest"><span>SESSION ✓</span><b>HYBRID</b><span>22.06.26</span></div>
  <div class="card">
    <div class="holo"></div><div class="holo2"></div><div class="glass"></div>
    <div class="c">
      <div class="tier"><i></i>Holo · Session</div>
      <div class="name">Night workout</div>
      <div class="sub">✎ NAME THIS WORKOUT</div>
      <div class="big">20<small>.0t</small></div>
      <div class="foot">
        <div><b>1</b><span>Minutes</span></div>
        <div><b>2</b><span>Sets</span></div>
        <div><b>20.0t</b><span>Volume</span></div>
      </div>
    </div>
    <div class="serial">№ 0001 / ∞</div>
  </div>
  <div class="acts">
    <button class="share">↗ Share to story</button>
    <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
  </div>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
