<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Bold</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{--ink:#0c0d0c;--ink2:#141614;--card:#161816;--line:#2a2d2a;--lime:#c4f035;--chalk:#f3f4ef;--ash:#8b8f86;--blue:#7fd4e8;--violet:#c9a9f0;--amber:#f0b45e;--red:#e0625e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Archivo',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
.phone{--fg:var(--chalk);width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;color:var(--fg);background:var(--ink)}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:40;font-family:'JetBrains Mono';font-size:14px;font-weight:600;color:var(--ink)}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--fg);opacity:.22;z-index:40}
.logo{font-weight:900;font-size:14px;letter-spacing:.3em}
.statlabel{font-family:'Archivo Narrow';font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);display:block;margin-top:4px}
.actions{margin-top:auto}
.primary{width:100%;border:none;border-radius:0;padding:18px;font-family:inherit;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;background:var(--lime);color:var(--ink)}
.srow{display:flex;gap:10px;margin-top:10px}
.srow button{flex:1;border:2px solid var(--chalk);background:transparent;color:var(--fg);border-radius:0;padding:12px;font-family:inherit;font-weight:800;font-size:13px;text-transform:uppercase;cursor:pointer}
.done{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ash);font-family:'JetBrains Mono';font-size:12px;padding:15px 0 0;cursor:pointer}
/* —— bold art —— */
.stripe{position:absolute;left:0;right:0;top:0;height:46%;background:var(--lime);clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}
.bignum{position:absolute;top:104px;left:0;right:0;text-align:center;font-weight:900;font-size:208px;line-height:.8;letter-spacing:-.07em;color:var(--ink)}
.bignum small{font-weight:700;font-size:58px}
.wrap{position:absolute;inset:0;padding:64px 28px 30px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--ink);position:relative;z-index:2}
.badge{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.spacer{flex:1}
.kicker{font-family:'JetBrains Mono';font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.h1{font-weight:900;font-size:58px;line-height:.86;letter-spacing:-.04em;text-transform:uppercase;margin-top:10px}
.sub{font-weight:600;font-size:16px;color:var(--ash);margin-top:14px}
.stats{display:flex;margin-top:24px;border-top:2px solid var(--line)}
.stat{flex:1;padding:16px 2px;border-right:2px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-weight:900;font-size:28px;letter-spacing:-.02em}
.actions{margin-top:22px}
</style></head>
<body><div class="phone">
  <div class="stripe"></div>
  <div class="bignum">20<small>.0t</small></div>
  <div class="statusbar"><span class="time">22:41</span><span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="badge">Session ✓</div></div>
    <div class="spacer"></div>
    <div class="kicker">Twenty tonnes moved</div>
    <div class="h1">Night<br>workout.</div>
    <div class="sub">🐋 Heavier than a humpback whale.</div>
    <div class="stats">
      <div class="stat"><b>1</b><span class="statlabel">Minutes</span></div>
      <div class="stat"><b>2</b><span class="statlabel">Sets</span></div>
      <div class="stat"><b>20.0t</b><span class="statlabel">Volume</span></div>
    </div>
    <div class="actions">
      <button class="primary">↗ Share to story</button>
      <div class="srow"><button>★ Save as routine</button><button>See analysis →</button></div>
      <button class="done">Done — back to Today</button>
    </div>
  </div>
  <div class="home"></div>
</div></body></html>
