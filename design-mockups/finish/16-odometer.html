<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 16 Odometer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--surface:#141814;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:radial-gradient(circle at 50% 20%,#161d16,transparent 60%),var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:60px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.h1{font-size:15px;color:var(--ash);margin:6px 0 18px}
.odo{display:flex;gap:6px;background:#05070500;border:1px solid var(--line);border-radius:14px;padding:14px 12px;box-shadow:inset 0 2px 14px rgba(0,0,0,.7)}
.reel{width:46px;height:64px;overflow:hidden;background:linear-gradient(#0e120e,#070907);border-radius:6px;position:relative}
.reel:before,.reel:after{content:"";position:absolute;left:0;right:0;height:14px;z-index:2}
.reel:before{top:0;background:linear-gradient(#000,transparent)}
.reel:after{bottom:0;background:linear-gradient(transparent,#000)}
.col{display:flex;flex-direction:column;align-items:center;font-family:'Space Mono';font-weight:700;font-size:44px;color:var(--lime);line-height:64px;animation:roll 1.6s cubic-bezier(.2,.8,.2,1) forwards}
.r1 .col{animation-delay:.1s}.r2 .col{animation-delay:.3s}.r3 .col{animation-delay:.5s}
@keyframes roll{from{transform:translateY(-640px)}to{transform:translateY(0)}}
.dot{align-self:flex-end;font-size:44px;color:var(--lime);line-height:64px;font-family:'Space Mono';font-weight:700}
.unit{align-self:center;font-size:22px;color:var(--ash);font-weight:800;margin-left:4px}
.punch{font-weight:900;font-size:26px;margin-top:22px}
.punch b{color:var(--lime)}
.sub{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:8px}
.stats{display:flex;gap:18px;margin-top:18px;font-family:'Space Mono';font-size:12px;color:var(--ash)}
.stats b{color:var(--chalk);font-family:Archivo;font-size:18px;display:block}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Total moved</div>
  <div class="h1">Push Day A · complete ✓</div>
  <div class="odo">
    <div class="reel r1"><div class="col">9876543210<br>4</div></div>
    <div class="dot">.</div>
    <div class="reel r2"><div class="col">9876543210<br>2</div></div>
    <div class="unit">t</div>
  </div>
  <div class="punch">≈ one <b>small car</b> 🚗</div>
  <div class="sub">heavier than you think</div>
  <div class="stats"><div><b>47'</b>time</div><div><b>18</b>sets</div><div><b>2🏆</b>prs</div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share the count</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div></body></html>
