<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HYBRID · Profile 05 — Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0c0d0c;--ink2:#141614;--line:#2a2d2a;--lime:#c4f035;--chalk:#f3f4ef;--ash:#8b8f86;--disp:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--lime-t:#d6f56a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050605;color:var(--chalk);font-family:var(--disp);min-height:100vh;display:grid;place-items:center;padding:34px;-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone{width:320px;height:712px;border-radius:46px;background:var(--ink);border:1px solid var(--line);box-shadow:0 40px 90px -30px #000,inset 0 0 0 6px #000;position:relative;overflow:hidden}
.phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:22px;border-radius:14px;background:#000;z-index:40}
.screen{position:absolute;inset:0;padding:54px 24px 96px;z-index:10;display:flex;flex-direction:column}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);display:flex;justify-content:space-between}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,#3a3d36,#161816);border:1px solid #4a4d44;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--lime-t);margin-top:34px}
.name{font-weight:900;font-size:46px;line-height:.98;letter-spacing:-.04em;margin-top:22px}
.name b{color:var(--lime)}
.role{font-family:var(--mono);font-size:12px;color:var(--ash);margin-top:14px;letter-spacing:.04em}
.rule{height:1px;background:var(--line);margin:26px 0}
.kv{display:flex;justify-content:space-between;padding:11px 0}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.kv .v{font-weight:700;font-size:15px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.foot .t{font-family:var(--mono);font-size:11px;color:var(--ash)}
.edit{font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:11px 20px}
.nav{position:absolute;left:14px;right:14px;bottom:16px;height:62px;border-radius:999px;background:rgba(20,22,20,.92);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:30}
.nav .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ash);font-size:15px}.nav .av2{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#3a3d36,#161816);outline:2px solid var(--lime);outline-offset:2px}
.lab{text-align:center}.lab .n{font-family:var(--mono);font-size:11px;color:var(--lime);letter-spacing:.14em}.lab .t{font-weight:800;font-size:16px;margin-top:3px}.lab .d{color:var(--ash);font-size:12px;margin-top:4px;max-width:300px;line-height:1.5}
</style></head>
<body><div class="wrap">
<div class="phone">
  <div class="screen">
    <div class="kick"><span>Profile</span><span>⚙</span></div>
    <div class="av">YL</div>
    <div class="name">Youssef<br>Labidi<b>.</b></div>
    <div class="role">HYBRID ATHLETE — FULL MEMBER SINCE 2024</div>
    <div class="rule"></div>
    <div class="kv"><div class="k">Hybrid Index</div><div class="v">82</div></div>
    <div class="kv"><div class="k">Streak</div><div class="v">16 weeks</div></div>
    <div class="kv"><div class="k">Sessions</div><div class="v">248</div></div>
    <div class="kv"><div class="k">Goal</div><div class="v">Hyrox</div></div>
    <div class="foot"><div class="t">↗ Share athlete card</div><div class="edit">Edit</div></div>
  </div>
  <div class="nav"><div class="ic">▦</div><div class="ic">＋</div><div class="ic">▤</div><div class="ic">•••</div><div class="av2"></div></div>
</div>
<div class="lab"><div class="n">05</div><div class="t">Editorial</div><div class="d">Maximum restraint — oversized name, deep black space, a quiet key/value ledger. Pure Apple.</div></div>
</div></body></html>
