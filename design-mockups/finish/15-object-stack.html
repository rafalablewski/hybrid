<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 15 Object Stack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--surface:#141814;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.eq{font-weight:900;font-size:30px;margin:10px 0 4px}
.eq b{color:var(--lime)}
.equals{font-family:'Space Mono';color:var(--ash);font-size:14px;margin:10px 0}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.grid .o{font-size:46px;animation:pin .4s backwards}
.grid .o:nth-child(2){animation-delay:.12s}
.grid .o:nth-child(3){animation-delay:.24s}
.grid .o.half{opacity:.5}
@keyframes pin{from{transform:scale(.3);opacity:0}}
.note{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:12px}
.note b{color:var(--chalk)}
.stats{display:flex;gap:10px;width:100%;margin-top:16px}
.s{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px}
.s b{display:block;font-size:20px;font-weight:900}.s span{font-family:'Space Mono';font-size:9px;color:var(--ash)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Fun fact · Push Day A</div>
  <div class="eq">You moved <b>4.2 tonnes</b></div>
  <div class="equals">— that's about —</div>
  <div class="grid">
    <div class="o">🚗</div><div class="o">🚗</div><div class="o half">🚗</div>
  </div>
  <div class="note"><b>2.8 small cars</b> stacked up 🚗</div>
  <div class="stats">
    <div class="s"><b>47</b><span>MIN</span></div>
    <div class="s"><b>18</b><span>SETS</span></div>
    <div class="s"><b>2 🏆</b><span>PRS</span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share the stack</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div></body></html>
