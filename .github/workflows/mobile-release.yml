name: Mobile — build & TestFlight

# Builds the iOS app on a GitHub cloud Mac with APPLE'S OWN tools (Xcode +
# Fastlane) and uploads it to TestFlight. There is NO Expo build service here:
# `expo prebuild` is just local code-generation (no Expo account/token), and
# every credential talks only to Apple. GitHub Actions is free + unlimited on a
# public repo, so this has no build quota.
#
# Trigger: GitHub → Actions → "Mobile — build & TestFlight" → Run workflow
# (or push a tag like `mobile-v1.0.1`). Build numbers auto-increment from
# TestFlight — nothing to bump by hand.
#
# ── Required repo secrets (Settings → Secrets and variables → Actions) ────────
#   APPLE_DIST_CERT_P12_BASE64   Your Apple Distribution certificate exported
#                                from Keychain Access as a .p12 (WITH its private
#                                key), then base64-encoded:
#                                  base64 -i dist.p12 | pbcopy
#   APPLE_DIST_CERT_PASSWORD     The password you set when exporting that .p12.
#   APPLE_ASC_API_KEY_P8         Full contents of the App Store Connect API .p8.
#   APPLE_ASC_KEY_ID             The .p8 Key ID (ZRWGCS2PUS).
#   APPLE_ASC_ISSUER_ID          App Store Connect → Integrations → Issuer ID.
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Public Supabase anon key (baked into the JS
#                                bundle at build time so sign-in works).
# (EXPO_TOKEN is no longer used — you can delete it.)

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build + TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Generate native iOS project (local expo prebuild — no Expo account)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Decode signing secrets
        working-directory: apps/mobile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          mkdir -p fastlane
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > fastlane/dist.p12
          printf '%s\n' "$ASC_KEY_P8" > fastlane/asc-key.p8

      - name: Build + upload to TestFlight
        working-directory: apps/mobile
        env:
          DIST_CERT_P12_PATH: ${{ github.workspace }}/apps/mobile/fastlane/dist.p12
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ github.workspace }}/apps/mobile/fastlane/asc-key.p8
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: fastlane ios beta

      - name: Clean up secrets
        if: always()
        working-directory: apps/mobile
        run: rm -f fastlane/dist.p12 fastlane/asc-key.p8
