xt-transform:uppercase; color:var(--dim); z-index:30}\n\n  .reveal{opacity:0; transform:translateY(22px)}\n  .on .reveal{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}\n  .on .reveal:nth-child(2){animation-delay:.08s}\n  .on .reveal:nth-child(3){animation-delay:.16s}\n  .on .reveal:nth-child(4){animation-delay:.24s}\n  .on .reveal:nth-child(5){animation-delay:.32s}\n  @keyframes rise{to{opacity:1; transform:none}}\n\n  .nav{position:absolute; inset:0; display:flex; z-index:35}\n  .nav>div{flex:1}\n  .hint{position:absolute; bottom:60px; right:20px; font-size:11px; color:var(--dim); letter-spacing:.2em; z-index:30; opacity:.7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\" id=\"stage\">\n  \u003cdiv class=\"stars\">\u003c/div>\n  \u003cdiv class=\"bars\" id=\"bars\">\u003c/div>\n\n  \u003c!-- 0 intro -->\n  \u003csection class=\"slide\">\n    \u003cdiv class=\"kicker reveal\">Hybrid · 2026 Recap\u003c/div>\n    \u003ch1 class=\"reveal\">Your year was\u003cbr>\u003cspan class=\"glow\">astronomical.\u003c/span>\u003c/h1>\n    \u003cp class=\"lead reveal\">You crossed galaxies of sweat. Let's chart the orbit you carved this season.\u003c/p>\n    \u003cspan class=\"badge reveal\" style=\"margin-top:28px\">Tap to launch ✦\u003c/span>\n  \u003c/section>\n\n  \u003c!-- 1 minutes -->\n  \u003csection class=\"slide\">\n    \u003cdiv class=\"kicker reveal\">Time in the cosmos\u003c/div>\n    \u003cdiv class=\"stat huge reveal\" data-count=\"1840\">0\u003c/div>\n    \u003cdiv class=\"unit reveal\">minutes of training\u003c/div>\n    \u003cp class=\"lead reveal\">That's \u003cb style=\"color:var(--cyan)\">30.6 hours\u003c/b> in the void — enough to orbit your own discipline 14 times over.\u003c/p>\n  \u003c/section>\n\n  \u003c!-- 2 exercises orbit -->\n  \u003csection class=\"slide\">\n    \u003cdiv class=\"kicker reveal\">A solar system of effort\u003c/div>\n    \u003cdiv class=\"orbit reveal\">\n      \u003cdiv class=\"ring\">\u003c/div>\u003cdiv ance.now();(function f(n){const p=Math.min((n-s)/1300,1),e=1-Math.pow(1-p,3);el.textContent=Math.floor(t*e).toLocaleString('en-US');p\u003c1?requestAnimationFrame(f):el.textContent=t.toLocaleString('en-US');})(s);}\nfunction show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));seg.forEach((b,k)=>{b.classList.toggle('done',k\u003ci);b.classList.toggle('active',k===i);});slides[i].querySelectorAll('[data-count]').forEach(countUp);}\ndocument.getElementById('nav').addEventListener('click',e=>{const d=e.target.closest('[data-dir]');if(d)show(i+ +d.dataset.dir);});\ndocument.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);});\nshow(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n\u003ctitle>Fitness Wrapped — Wild Bloom\u003c/title>\n\u003cstyle>\n  :root{\n    --cream:#fff8ee; --ink:#1f3d2b; --dim:#5e7a64;\n    --leaf:#2fa86a; --moss:#0f7a4d; --coral:#ff7a59; --sun:#ffd24c; --sky:#7ed0e0; --berry:#e85d8a;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\n  html,body{height:100%}\n  body{font-family:\"Trebuchet MS\",\"Segoe UI\",Inter,sans-serif;background:#cfe9d8;color:var(--ink);overflow:hidden;display:grid;place-items:center}\n  .stage{position:relative;width:min(440px,100vw);height:min(950px,100vh);overflow:hidden;user-select:none;\n    background:linear-gradient(180deg,#fff8ee 0%,#e6f6ea 55%,#cfeede 100%)}\n  .sunburst{position:absolute;top:-120px;left:50%;width:480px;height:480px;margin-left:-240px;border-radius:50%;\n    background:radial-gradient(circle,var(--sun) 0%,rgba(255,210,76,.4) 40%,transparent 70%);animation:sway 7s ease-in-out infinite;pointer-events:none}\n  @keyframes sway{0%,100%{transform:scale(1)}50%{transform:sca et i=0;\nconst lv=document.getElementById('leaves'),emoji=['🍃','🌿','🍂','🌸'];\nfor(let k=0;k\u003c16;k++){const e=document.createElement('div');e.className='leaf';e.textContent=emoji[k%emoji.length];e.style.left=(Math.random()*100)+'%';e.style.animationDuration=(7+Math.random()*7)+'s';e.style.animationDelay=(Math.random()*8)+'s';lv.appendChild(e);}\nconst cv=document.getElementById('canopy'),cols=['#2fa86a','#0f7a4d','#7ed0e0','#ffd24c','#ff7a59'];\nfor(let k=0;k\u003c14;k++){const b=document.createElement('b');const sz=26+Math.random()*40;b.style.width=sz+'px';b.style.height=sz+'px';b.style.left=(Math.random()*150-75)+'px';b.style.top=(Math.random()*120-100)+'px';b.style.background=cols[k%cols.length];b.style.transitionDelay=(0.4+k*0.04)+'s';cv.appendChild(b);}\nfunction countUp(el){const t=+el.dataset.count;if(!t)return;const suf=el.dataset.suffix||'';const s=performance.now();(function f(n){const p=Math.min((n-s)/1200,1),e=1-Math.pow(1-p,3);el.textContent=Math.floor(t*e).toLocaleString('en-US')+suf;p\u003c1?requestAnimationFrame(f):el.textContent=t.toLocaleString('en-US')+suf;})(s);}\nfunction show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));seg.forEach((b,k)=>{b.classList.toggle('done',k\u003ci);b.classList.toggle('active',k===i);});slides[i].querySelectorAll('[data-count]').forEach(countUp);}\ndocument.getElementById('nav').addEventListener('click',e=>{const d=e.target.closest('[data-dir]');if(d)show(i+ +d.dataset.dir);});\ndocument.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);});\nshow(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n\u003ctitle>Fitness Wrapped — Concrete\u003c/title>\n\u003cstyle>\n  :root{\n    --paper:#f3f1ea; --ink:#0a0a0a; --acid:#e6ff00; - :var(--ink)}\n  .foot{position:absolute;bottom:16px;left:28px;right:28px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;z-index:30}\n  .nav{position:absolute;inset:0;display:flex;z-index:35}.nav>div{flex:1}\n  /* hard cut, no easing — brutalist */\n  .reveal{opacity:0}.on .reveal{animation:cut .01s forwards}\n  .on .reveal:nth-child(2){animation-delay:.12s}.on .reveal:nth-child(3){animation-delay:.24s}.on .reveal:nth-child(4){animation-delay:.36s}.on .reveal:nth-child(5){animation-delay:.48s}\n  @keyframes cut{to{opacity:1}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\" id=\"stage\">\n  \u003cdiv class=\"bars\" id=\"bars\">\u003c/div>\n\n  \u003csection class=\"slide\">\n    \u003cspan class=\"label reveal\">Hybrid / 2026 / Recap\u003c/span>\n    \u003ch1 class=\"reveal\">No\u003cbr>filter.\u003cbr>\u003cspan class=\"underline\">Just\u003cbr>work.\u003c/span>\u003c/h1>\n    \u003cp class=\"note reveal\">The numbers don't lie. Tap →\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"slide\">\n    \u003cspan class=\"label acid reveal\">01 — Minutes\u003c/span>\n    \u003cdiv class=\"meganum reveal\" data-count=\"1975\">0\u003c/div>\n    \u003cdiv class=\"rule reveal\">\u003c/div>\n    \u003cdiv class=\"meta reveal\">\u003cspan>32.9 Hours\u003c/span>\u003cspan>≈ 38 / Week\u003c/span>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"slide\">\n    \u003cspan class=\"label reveal\">02 — Exercises\u003c/span>\n    \u003cdiv class=\"meganum reveal\" data-count=\"263\">0\u003c/div>\n    \u003cdiv class=\"tally reveal\" id=\"tally\">\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"slide\">\n    \u003cspan class=\"label red reveal\">03 — Volume\u003c/span>\n    \u003cdiv class=\"meganum reveal\" data-count=\"55310\">0\u003c/div>\n    \u003cdiv class=\"rule reveal\">\u003c/div>\n    \u003cdiv class=\"meta reveal\">\u003cspan>Kilograms\u003c/span>\u003cspan>≈ 8 Car
