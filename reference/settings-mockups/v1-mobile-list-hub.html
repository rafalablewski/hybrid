<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HYBRID Settings — V1 · Mobile List Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0c0d0c; --ink2:#141614; --card:#161816; --line:#2a2d2a;
    --lime:#c4f035; --chalk:#f3f4ef; --ash:#8b8f86;
    --blue:#7fd4e8; --violet:#c9a9f0; --amber:#f0b45e; --red:#e0625e;
    --disp:'Archivo',sans-serif; --cond:'Archivo Narrow',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #16181a 0%, #0c0d0c 60%);
    min-height:100vh; font-family:var(--disp); color:var(--chalk);
    display:flex; flex-direction:column; align-items:center; gap:18px; padding:32px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .meta{font-family:var(--mono); font-size:12px; color:var(--ash); text-align:center; line-height:1.7}
  .meta b{color:var(--lime); font-weight:600}

  .phone{
    width:390px; max-width:100%; height:820px; background:var(--ink);
    border:1px solid var(--line); border-radius:46px; padding:10px;
    box-shadow:0 40px 120px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
    position:relative;
  }
  .screen{position:absolute; inset:10px; border-radius:38px; overflow:hidden; background:var(--ink); display:flex; flex-direction:column;}
  .notch{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:30px; background:#000; border-radius:18px; z-index:30}

  header{flex:none; padding:54px 20px 12px; background:linear-gradient(180deg, rgba(20,22,20,.96), rgba(12,13,12,.7)); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:relative; z-index:20;}
  .hrow{display:flex; align-items:center; gap:12px}
  .back{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--ink2); color:var(--chalk); display:none; align-items:center; justify-content:center; cursor:pointer; flex:none}
  .htitle{font-weight:800; font-size:22px; letter-spacing:-.02em}
  .htitle .crumb{color:var(--ash); font-weight:600; font-size:13px; display:block; font-family:var(--mono); margin-bottom:2px}
  .search{margin-top:14px; display:flex; align-items:center; gap:10px; background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:10px 13px}
  .search input{flex:1; background:none; border:none; outline:none; color:var(--chalk); font-family:var(--mono); font-size:14px}
  .search input::placeholder{color:var(--ash)}
  .search svg{color:var(--ash); flex:none}

  .body{flex:1; overflow-y:auto; padding:16px 16px 40px; scrollbar-width:thin; scrollbar-color:var(--line) transparent}
  .body::-webkit-scrollbar{width:6px}
  .body::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px}

  .profile{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:22px; cursor:pointer; transition:.15s}
  .profile:hover{border-color:#3a3d3a}
  .avatar{width:54px; height:54px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:var(--ink); background:linear-gradient(135deg,var(--lime),#9bd400)}
  .profile .pname{font-weight:800; font-size:17px}
  .profile .pmail{font-family:var(--mono); font-size:12px; color:var(--ash); margin-top:2px}
  .badges{display:flex; gap:6px; margin-top:7px}
  .badge{font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.08em; padding:2px 7px; border-radius:6px; font-weight:600}
  .b-role{color:var(--violet); background:rgba(201,169,240,.12); border:1px solid rgba(201,169,240,.4)}
  .b-free{color:var(--ash); border:1px solid var(--line)}
  .chev{margin-left:auto; color:var(--ash); flex:none}

  .group{margin-bottom:24px}
  .glabel{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ash); padding:0 4px 8px; font-weight:600}
  .list{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .row{display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer; transition:background .12s; border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row:hover{background:rgba(255,255,255,.025)}
  .ico{width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center}
  .ico svg{width:17px; height:17px}
  .i-lime{background:rgba(196,240,53,.13); color:var(--lime)}
  .i-blue{background:rgba(127,212,232,.13); color:var(--blue)}
  .i-violet{background:rgba(201,169,240,.13); color:var(--violet)}
  .i-amber{background:rgba(240,180,94,.13); color:var(--amber)}
  .i-red{background:rgba(224,98,94,.13); color:var(--red)}
  .i-ash{background:rgba(139,143,134,.13); color:var(--ash)}
  .rtext{flex:1; min-width:0}
  .rtitle{font-weight:600; font-size:15px}
  .rsub{font-family:var(--mono); font-size:11px; color:var(--ash); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rval{font-family:var(--mono); font-size:12px; color:var(--ash); flex:none; display:flex; align-items:center; gap:6px}

  .hub.hidden{display:none}
  .pane{animation:slide .22s ease}
  @keyframes slide{from{opacity:0; transform:translateX(16px)} to{opacity:1; transform:translateX(0)}}

  .section{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:16px}
  .seckick{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; font-weight:600}
  .secdesc{font-family:var(--mono); font-size:12px; color:var(--ash); margin-top:6px; line-height:1.6}
  .field{margin-top:16px}
  .flabel{font-family:var(--mono); font-size:12px; color:var(--ash); margin-bottom:7px; display:block}
  .input{width:100%; background:var(--ink2); border:1px solid var(--line); border-radius:12px; padding:11px 13px; color:var(--chalk); font-family:var(--mono); font-size:14px; outline:none}
  .input:focus{border-color:var(--lime)}
  textarea.input{resize:vertical}
  .segrow{display:flex; gap:8px; flex-wrap:wrap}
  .seg{font-family:var(--mono); font-size:13px; padding:9px 16px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--ash); cursor:pointer; transition:.12s}
  .seg.on{color:var(--lime); background:rgba(196,240,53,.12); border-color:var(--lime)}
  .btn{font-family:var(--disp); font-weight:700; font-size:14px; padding:11px 18px; border-radius:12px; cursor:pointer; border:1px solid; transition:.12s}
  .btn-lime{color:var(--lime); background:rgba(196,240,53,.12); border-color:var(--lime)}
  .btn-ghost{color:var(--chalk); background:transparent; border-color:var(--line)}
  .btn-red{color:#fff; background:var(--red); border-color:var(--red)}

  .trow{display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line)}
  .trow:first-of-type{border-top:none}
  .ttext{flex:1}
  .ttitle{font-weight:600; font-size:15px}
  .tdesc{font-family:var(--mono); font-size:11px; color:var(--ash); margin-top:3px; line-height:1.5}
  .toggle{flex:none; width:46px; height:27px; border-radius:999px; border:1px solid var(--line); background:transparent; position:relative; cursor:pointer; transition:.18s}
  .toggle.on{background:var(--lime); border-color:var(--lime)}
  .knob{position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:var(--ash); transition:.18s}
  .toggle.on .knob{left:21px; background:var(--ink)}

  .danger{border-color:rgba(224,98,94,.4); border-left:3px solid var(--red)}
  .note{font-family:var(--mono); font-size:11px; color:var(--ash); margin-top:10px; line-height:1.6}
  .upgrade{background:linear-gradient(135deg, rgba(196,240,53,.14), rgba(196,240,53,.03)); border:1px solid rgba(196,240,53,.4)}
</style>
</head>
<body>
  <div class="meta"><b>HYBRID Settings — Version 1</b><br />Mobile list hub · iOS-style grouped list with drill-in detail (Instagram pattern)</div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <header>
        <div class="hrow">
          <button class="back" id="back" onclick="goHub()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="htitle"><span class="crumb" id="crumb">SETTINGS &amp; ACTIVITY</span><span id="title">Settings</span></div>
        </div>
        <div class="search" id="searchbar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input placeholder="Search settings" />
        </div>
      </header>
      <div class="body">
        <div class="hub" id="hub"></div>
        <div id="panes"></div>
      </div>
    </div>
  </div>

<script>
  const ICONS = {
    user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
    sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/></svg>',
    dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6v12M3 9v6M18 6v12M21 9v6M6 12h12"/></svg>',
    bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    whistle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a6 6 0 0 0 6 6h2l4 3v-3a6 6 0 0 0 0-12H9a6 6 0 0 0-6 6z"/><circle cx="9" cy="12" r="1.5" fill="currentColor"/></svg>',
    shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
    spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>',
    download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  };
  const chev='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const ico=n=>ICONS[n]||'';
  const toggle=(t,d,on)=>'<div class="trow"><div class="ttext"><div class="ttitle">'+t+'</div><div class="tdesc">'+d+'</div></div><button class="toggle'+(on?' on':'')+'"><span class="knob"></span></button></div>';

  const GROUPS = [
    { label:'How you use HYBRID', rows:[
      {id:'account', ic:'user', tone:'lime', t:'Account & profile', s:'Name, email, account type'},
      {id:'prefs', ic:'sliders', tone:'blue', t:'Preferences', s:'Appearance, language, units', v:'Dark · EN · kg'},
      {id:'logger', ic:'dumbbell', tone:'amber', t:'Workout logger', s:'Detail, volume counting'},
      {id:'notif', ic:'bell', tone:'violet', t:'Notifications', s:'Recaps, coach, reminders'},
    ]},
    { label:'Who can see & reach you', rows:[
      {id:'privacy', ic:'eye', tone:'blue', t:'Privacy', s:'Sharing, discoverability, analytics'},
      {id:'coaching', ic:'whistle', tone:'violet', t:'Coaching & access', s:'Become a coach, request access'},
    ]},
    { label:'Login & billing', rows:[
      {id:'security', ic:'shield', tone:'blue', t:'Security', s:'Password, 2-factor, sessions'},
      {id:'billing', ic:'spark', tone:'lime', t:'Subscription', s:'Your plan & billing', v:'Free'},
    ]},
    { label:'Your data & support', rows:[
      {id:'data', ic:'download', tone:'ash', t:'Your data', s:'Export everything'},
      {id:'about', ic:'info', tone:'ash', t:'Help & about', s:'Support, version 1.0'},
      {id:'danger', ic:'trash', tone:'red', t:'Danger zone', s:'Sign out, erase account', danger:true},
    ]},
  ];

  function renderHub(){
    const profile = `<div class="profile" data-pane="account">
        <div class="avatar">R</div>
        <div><div class="pname">Rafal Ablewski</div><div class="pmail">rafal@hybrid.app</div>
        <div class="badges"><span class="badge b-role">Client</span><span class="badge b-free">Free</span></div></div>
        <span class="chev">${chev}</span></div>`;
    const groups = GROUPS.map(g=>`<div class="group"><div class="glabel">${g.label}</div><div class="list">${
      g.rows.map(r=>`<div class="row" data-pane="${r.id}">
        <div class="ico i-${r.tone}">${ico(r.ic)}</div>
        <div class="rtext"><div class="rtitle"${r.danger?' style="color:var(--red)"':''}>${r.t}</div><div class="rsub">${r.s}</div></div>
        <span class="rval">${r.v?r.v+' ':''}${chev}</span></div>`).join('')
    }</div></div>`).join('');
    document.getElementById('hub').innerHTML = profile+groups;
    document.querySelectorAll('[data-pane]').forEach(el=>el.onclick=()=>openPane(el.dataset.pane));
  }

  const PANES = {
    account:{title:'Account & profile',html:`
      <div class="section"><div class="seckick" style="color:var(--lime)">IDENTITY</div>
        <div class="field"><label class="flabel">Display name</label><input class="input" value="Rafal Ablewski"/></div>
        <div class="field"><label class="flabel">Email</label><input class="input" value="rafal@hybrid.app"/></div>
        <button class="btn btn-lime" style="margin-top:16px">Save changes</button></div>
      <div class="section"><div class="seckick" style="color:var(--violet)">ACCOUNT TYPE</div>
        <div class="secdesc">You're on a <b style="color:var(--chalk)">Client · Free</b> plan. Switch to Full to unlock the athlete toolkit.</div>
        <button class="btn btn-ghost" style="margin-top:14px" data-go="billing">View subscription</button></div>`},
    prefs:{title:'Preferences',html:`
      <div class="section"><div class="seckick" style="color:var(--blue)">APPEARANCE</div>
        <div class="field"><label class="flabel">Theme</label><div class="segrow"><button class="seg on">Dark</button><button class="seg">Light</button></div></div>
        <div class="field"><label class="flabel">Template</label><div class="segrow"><button class="seg on">Aurora</button><button class="seg">Classic</button></div></div></div>
      <div class="section"><div class="seckick" style="color:var(--blue)">REGION & UNITS</div>
        <div class="field"><label class="flabel">Language</label><div class="segrow"><button class="seg on">EN</button><button class="seg">PL</button><button class="seg">DE</button></div></div>
        <div class="field"><label class="flabel">Units</label><div class="segrow"><button class="seg on">KG</button><button class="seg">LB</button></div></div></div>`},
    logger:{title:'Workout logger',html:`
      <div class="section"><div class="seckick" style="color:var(--amber)">LOGGING</div>
        <div class="secdesc">How much detail you capture per set, and how training volume is counted.</div>
        <div class="field"><label class="flabel">Logger mode</label><div class="segrow"><button class="seg on">Detailed</button><button class="seg">Simple</button></div></div></div>
      <div class="section"><div class="seckick" style="color:var(--amber)">VOLUME</div><div style="margin-top:8px">
        ${toggle('Count warm-ups in volume','Include warm-up sets in your weekly tonnage.',false)}
        ${toggle('Fractional volume','Count back-off & top-set fractions toward volume targets.',true)}
      </div></div>`},
    notif:{title:'Notifications',html:`
      <div class="section"><div class="seckick" style="color:var(--violet)">NOTIFICATIONS</div>
        <div class="secdesc">Choose what HYBRID can email or push to you.</div><div style="margin-top:10px">
        ${toggle('Weekly recap','Your Sunday training summary.',true)}
        ${toggle('Coach messages','When your coach replies or assigns work.',true)}
        ${toggle('Check-in reminders','A nudge when your weekly check-in is due.',true)}
        ${toggle('Product updates','Occasional news about new features.',false)}
      </div></div>`},
    privacy:{title:'Privacy',html:`
      <div class="section"><div class="seckick" style="color:var(--blue)">PRIVACY</div>
        <div class="secdesc">Control who sees your training and how your data is used.</div><div style="margin-top:10px">
        ${toggle('Share detail with my coach','Let a linked coach see full session detail, not just summaries.',true)}
        ${toggle('Discoverable in Talent','Appear in coach talent searches (benchmarks, never raw logs).',false)}
        ${toggle('Opt out of product analytics',"Don't include my usage in aggregate analytics.",false)}
      </div></div>`},
    coaching:{title:'Coaching & access',html:`
      <div class="section"><div class="seckick" style="color:var(--violet)">BECOME A COACH</div>
        <div class="secdesc">Apply with your credentials. An admin reviews it and grants the coach role on approval.</div>
        <div class="field"><label class="flabel">Your credentials</label><textarea class="input" rows="3" placeholder="Certifications, athletes coached, experience…"></textarea></div>
        <button class="btn" style="color:var(--violet);background:rgba(201,169,240,.12);border:1px solid var(--violet);margin-top:14px">Apply to coach</button></div>
      <div class="section"><div class="seckick" style="color:var(--blue)">REQUEST ACCESS</div>
        <div class="secdesc">Have an invite code or want to join a coach's roster? Request access here.</div>
        <button class="btn btn-ghost" style="margin-top:14px">Request access</button></div>`},
    security:{title:'Security',html:`
      <div class="section"><div class="seckick" style="color:var(--blue)">PASSWORD</div>
        <div class="field"><label class="flabel">New password</label><input class="input" type="password" placeholder="••••••••"/></div>
        <button class="btn btn-lime" style="margin-top:14px">Update password</button></div>
      <div class="section"><div class="seckick" style="color:var(--blue)">TWO-FACTOR (2FA)</div>
        <div class="secdesc">Add an authenticator app for an extra layer of security.</div>
        <button class="btn btn-ghost" style="margin-top:14px">Set up 2-factor</button></div>
      <div class="section"><div class="seckick" style="color:var(--blue)">ACTIVE SESSIONS</div>
        <div class="secdesc">Sign out of HYBRID on every device you've used.</div>
        <button class="btn btn-ghost" style="margin-top:14px">Sign out everywhere</button></div>`},
    billing:{title:'Subscription',html:`
      <div class="section upgrade"><div class="seckick" style="color:var(--lime)">UPGRADE TO FULL</div>
        <div class="secdesc">Unlock the full athlete toolkit — periodization, readiness, sport engine and prescription.</div>
        <button class="btn btn-lime" style="margin-top:16px;font-size:15px">Upgrade to Full</button>
        <div class="note">You're currently on the Free plan.</div></div>
      <div class="section"><div class="seckick" style="color:var(--ash)">CURRENT PLAN</div>
        <div class="secdesc"><b style="color:var(--chalk)">Free</b> — the lean tracker. No card on file.</div></div>`},
    data:{title:'Your data',html:`
      <div class="section"><div class="seckick" style="color:var(--blue)">EXPORT</div>
        <div class="secdesc">Download a complete copy of your account data — sessions, plans, benchmarks and profile.</div>
        <button class="btn btn-lime" style="margin-top:14px">Download my data</button></div>`},
    about:{title:'Help & about',html:`
      <div class="section"><div class="list" style="margin:-4px 0">
        <div class="row"><div class="rtext"><div class="rtitle">Help center</div></div><span class="rval">${chev}</span></div>
        <div class="row"><div class="rtext"><div class="rtitle">Contact support</div></div><span class="rval">${chev}</span></div>
        <div class="row"><div class="rtext"><div class="rtitle">Terms & privacy policy</div></div><span class="rval">${chev}</span></div>
      </div></div>
      <div class="section"><div class="secdesc" style="text-align:center">HYBRID · version 1.0.0</div></div>`},
    danger:{title:'Danger zone',html:`
      <div class="section"><div class="seckick" style="color:var(--ash)">SIGN OUT</div>
        <button class="btn btn-ghost" style="margin-top:14px">Sign out of this device</button></div>
      <div class="section danger"><div class="seckick" style="color:var(--red)">ERASE ACCOUNT</div>
        <div class="secdesc">Permanently delete all your training data. <b style="color:var(--red)">This cannot be undone.</b></div>
        <div class="field"><label class="flabel">Type RESET to confirm</label><input class="input" placeholder="RESET" style="max-width:200px"/></div>
        <button class="btn btn-red" style="margin-top:14px">Erase everything</button></div>`},
  };

  const panesEl=document.getElementById('panes');
  function openPane(id){
    const p=PANES[id]; if(!p) return;
    panesEl.innerHTML='<div class="pane">'+p.html+'</div>';
    document.getElementById('hub').classList.add('hidden');
    document.getElementById('back').style.display='flex';
    document.getElementById('title').textContent=p.title;
    document.getElementById('crumb').textContent='SETTINGS';
    document.getElementById('searchbar').style.display='none';
    document.querySelector('.body').scrollTop=0;
    panesEl.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>t.classList.toggle('on'));
    panesEl.querySelectorAll('.segrow').forEach(g=>g.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{g.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));b.classList.add('on');}));
    panesEl.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openPane(b.dataset.go));
  }
  function goHub(){
    panesEl.innerHTML='';
    document.getElementById('hub').classList.remove('hidden');
    document.getElementById('back').style.display='none';
    document.getElementById('title').textContent='Settings';
    document.getElementById('crumb').textContent='SETTINGS & ACTIVITY';
    document.getElementById('searchbar').style.display='flex';
    document.querySelector('.body').scrollTop=0;
  }
  renderHub();
</script>
</body>
</html>
