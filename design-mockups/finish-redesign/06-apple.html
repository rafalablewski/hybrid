<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Apple</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--ink:#0c0d0c;--chalk:#f3f4ef;--ash:#8b8f86;--lime:#c4f035;--blue:#7fd4e8;--violet:#c9a9f0;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000;
  background:radial-gradient(120% 80% at 50% -10%,#15211f 0%,#0a0c0a 55%)}
.wrap{height:100%;overflow-y:auto;padding:62px 22px 26px;display:flex;flex-direction:column;align-items:center}
.kick{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
.h1{font-weight:800;font-size:30px;letter-spacing:-.03em;margin-top:8px}
.name{font-size:15px;color:var(--ash);margin-top:4px;margin-bottom:14px}
.rings{position:relative;width:190px;height:190px;margin:6px 0 8px}
.ring{position:absolute;border-radius:50%;border-style:solid}
.r1{inset:0;border-width:14px;border-color:rgba(196,240,53,.16);box-shadow:inset 0 0 0 0 transparent}
.r1b{inset:0;border-width:14px;border-color:var(--lime) transparent transparent var(--lime);transform:rotate(-46deg)}
.r2{inset:26px;border-width:14px;border-color:rgba(127,212,232,.16)}
.r2b{inset:26px;border-width:14px;border-color:var(--blue) var(--blue) transparent transparent;transform:rotate(20deg)}
.r3{inset:52px;border-width:14px;border-color:rgba(201,169,240,.16)}
.r3b{inset:52px;border-width:14px;border-color:var(--violet) transparent transparent transparent;transform:rotate(-120deg)}
.ringc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringc b{font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.ringc span{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;color:var(--ash);margin-top:4px}
.legend{display:flex;gap:18px;margin:14px 0 8px}
.legend div{text-align:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend b{font-weight:700;font-size:17px}
.legend span{display:block;font-family:'JetBrains Mono';font-size:9px;color:var(--ash);letter-spacing:.1em;margin-top:2px}
.dots{display:flex;gap:7px;margin:8px 0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{width:22px;background:var(--lime)}
.spacer{flex:1;min-height:8px}
.acts{width:100%}
.btn{width:100%;border:none;border-radius:16px;padding:16px;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.share{background:var(--lime);color:#0a0c0a;box-shadow:0 10px 30px -8px rgba(196,240,53,.55)}
.ghost{background:rgba(255,255,255,.08);color:var(--chalk);border:1px solid var(--line);margin-top:10px}
.analysis{background:transparent;color:var(--blue);margin-top:12px;font-weight:600;font-size:15px}
.back{color:var(--ash);font-family:'JetBrains Mono';font-size:12px;padding:14px 0 2px}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="kick">Session complete</div>
  <div class="h1">Night workout</div>
  <div class="name">You closed every ring tonight.</div>
  <div class="rings">
    <div class="ring r1"></div><div class="ring r1b"></div>
    <div class="ring r2"></div><div class="ring r2b"></div>
    <div class="ring r3"></div><div class="ring r3b"></div>
    <div class="ringc"><div><b>20.0<span style="display:inline;font-size:18px"> t</span></b><span>VOLUME</span></div></div>
  </div>
  <div class="legend">
    <div><b><i style="background:var(--lime)"></i>20.0t</b><span>VOLUME</span></div>
    <div><b><i style="background:var(--blue)"></i>2</b><span>SETS</span></div>
    <div><b><i style="background:var(--violet)"></i>1<small style="font-size:11px;color:var(--ash)">m</small></b><span>MINUTES</span></div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="spacer"></div>
  <div class="acts">
    <button class="btn share">↗ Share to story</button>
    <button class="btn ghost">★ Save as routine</button>
    <button class="btn analysis">See your analysis →</button>
  </div>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
