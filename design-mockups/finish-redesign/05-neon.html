<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Neon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');
:root{--lime:#c4f035;--blue:#7fd4e8;--violet:#c9a9f0;--chalk:#f4f6f2;--ash:#8b93a0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:linear-gradient(180deg,#1a0f2e 0%,#0e0a22 46%,#07060f 70%,#050409 100%)}
.sun{position:absolute;top:108px;left:50%;transform:translateX(-50%);width:220px;height:220px;border-radius:50%;
  background:linear-gradient(180deg,#e8ff6a,#c4f035 40%,#7fd4e8);box-shadow:0 0 80px rgba(196,240,53,.5);overflow:hidden}
.sun:after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:repeating-linear-gradient(180deg,transparent 0 10px,#0e0a22 10px 16px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:300px;perspective:300px;overflow:hidden}
.grid{position:absolute;left:-50%;right:-50%;top:0;bottom:0;background-image:
  linear-gradient(rgba(127,212,232,.5) 1px,transparent 1px),
  linear-gradient(90deg,rgba(127,212,232,.4) 1px,transparent 1px);
  background-size:38px 38px;transform:rotateX(72deg);transform-origin:top}
.fade{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,transparent,#050409 78%)}
.wrap{position:absolute;inset:0;padding:54px 28px 26px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:.3em;font-size:15px;color:var(--lime);text-shadow:0 0 14px rgba(196,240,53,.7)}
.tag{font-family:'JetBrains Mono';font-size:11px;color:var(--blue);letter-spacing:.12em;text-shadow:0 0 12px rgba(127,212,232,.7)}
.spacer{flex:1}
.kick{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--violet);text-shadow:0 0 12px rgba(201,169,240,.6)}
.big{font-weight:900;font-size:104px;line-height:.84;letter-spacing:-.04em;margin-top:8px;color:#fff;
  text-shadow:0 0 18px rgba(196,240,53,.9),0 0 50px rgba(127,212,232,.6)}
.big small{font-size:40px;color:var(--lime)}
.sub{font-weight:800;font-size:21px;margin-top:14px;letter-spacing:-.01em}
.stats{display:flex;gap:10px;margin-top:22px}
.st{flex:1;border:1px solid rgba(127,212,232,.4);border-radius:14px;padding:13px 10px;background:rgba(127,212,232,.06);box-shadow:0 0 20px -6px rgba(127,212,232,.5),inset 0 0 18px -10px rgba(127,212,232,.6)}
.st b{display:block;font-weight:800;font-size:23px}
.st span{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase}
.share{width:100%;border:none;border-radius:14px;padding:17px;font-family:inherit;font-weight:900;font-size:16px;background:var(--lime);color:#06270a;cursor:pointer;margin-top:22px;box-shadow:0 0 36px -4px rgba(196,240,53,.8)}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1px solid rgba(201,169,240,.45);background:rgba(201,169,240,.08);border-radius:14px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--chalk);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--ash);padding:14px 0 0}
</style></head>
<body><div class="phone">
  <div class="sun"></div>
  <div class="floor"><div class="grid"></div></div><div class="fade"></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="tag">SESSION ✓</div></div>
    <div class="spacer"></div>
    <div class="kick">Tonight you moved</div>
    <div class="big">20.0<small>t</small></div>
    <div class="sub">Night workout — locked in.</div>
    <div class="stats">
      <div class="st"><b>1</b><span>Minutes</span></div>
      <div class="st"><b>2</b><span>Sets</span></div>
      <div class="st"><b>20.0t</b><span>Volume</span></div>
    </div>
    <button class="share">↗ Share to story</button>
    <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
    <div class="back">Done — back to Today</div>
  </div>
</div></body></html>
