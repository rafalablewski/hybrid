<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 04 Trading Card</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--surface:#16191500;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:48px 22px 24px;display:flex;flex-direction:column;align-items:center}
.done{font-family:'Space Mono';font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--lime);margin-bottom:14px}
.tcard{width:300px;border-radius:22px;padding:3px;background:linear-gradient(135deg,#c4f035,#5aa7ff,#b79cff,#c4f035);background-size:300% 300%;animation:foil 6s ease infinite;box-shadow:0 24px 60px -20px rgba(196,240,53,.4)}
@keyframes foil{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.tinner{background:#0e120e;border-radius:19px;padding:18px;position:relative;overflow:hidden}
.tinner:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%)}
.thead{display:flex;justify-content:space-between;align-items:center}
.tname{font-weight:900;font-size:20px}
.trar{font-family:'Space Mono';font-size:10px;color:#0a0c0a;background:var(--lime);padding:3px 8px;border-radius:6px;font-weight:700}
.art{height:120px;border-radius:14px;margin:12px 0;background:radial-gradient(circle at 70% 20%,rgba(196,240,53,.4),transparent 60%),#0a0c0a;display:grid;place-items:center;font-size:54px}
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ts{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}
.ts b{font-size:18px;font-weight:900;display:block}
.ts span{font-family:'Space Mono';font-size:9px;color:var(--ash);letter-spacing:.06em}
.tfun{font-size:12px;color:var(--ash);margin-top:12px;text-align:center}
.tfun b{color:var(--chalk)}
.btn{width:300px;border:none;border-radius:999px;padding:15px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;margin-top:14px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 24px -4px rgba(196,240,53,.55)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4);margin-top:10px}
.analysis{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:18px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="done">◆ Workout complete ◆</div>
  <div class="tcard"><div class="tinner">
    <div class="thead"><div class="tname">Push Day A</div><div class="trar">PR ×2</div></div>
    <div class="art">🏋️</div>
    <div class="tstats">
      <div class="ts"><b>4.2 t</b><span>VOLUME</span></div>
      <div class="ts"><b>18</b><span>SETS</span></div>
      <div class="ts"><b>47'</b><span>DURATION</span></div>
      <div class="ts"><b>🏆 2</b><span>RECORDS</span></div>
    </div>
    <div class="tfun">"You moved <b>4.2 t</b> — about a small car 🚗"</div>
  </div></div>
  <button class="btn share">↗ Share card</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
</div></div></body></html>
