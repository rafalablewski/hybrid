name: Mobile — build & TestFlight

# Builds the iOS app on EAS (Expo's CLOUD builders) and submits it to
# TestFlight — no local clone, no Mac. You trigger it from the browser:
# GitHub → Actions → "Mobile — build & TestFlight" → Run workflow
# (or push a tag like `mobile-v1.0.1`). The Ubuntu runner only kicks off the
# build on Expo's servers and waits — the actual compile + signing happen in
# the cloud, exactly like the sud-italia apps.
#
# Note: a cloud build DOES consume the EAS Build free-tier quota (that's the
# trade-off for not needing a Mac). The quota resets monthly, and OTA updates
# (eas update) carry JS changes for free in between — so you only spend a build
# here when native code changes or you cut a new TestFlight release.
#
# ── Required repo secrets (Settings → Secrets and variables → Actions) ────────
#   EXPO_TOKEN                     Expo access token (expo.dev → Account →
#                                  Settings → Access tokens). Lets EAS build +
#                                  manage credentials non-interactively.
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Public Supabase anon/publishable key,
#                                  embedded at build time so the app signs in.
#   APPLE_ASC_API_KEY_P8           The FULL CONTENTS of the App Store Connect
#                                  API key (.p8) file — open AuthKey_XXXX.p8 in
#                                  a text editor and paste everything (incl. the
#                                  BEGIN/END PRIVATE KEY lines). No encoding.
#   APPLE_ASC_KEY_ID               The .p8 Key ID (e.g. RQTCHVF25S).
#   APPLE_ASC_ISSUER_ID            App Store Connect → Users and Access →
#                                  Integrations → Keys → Issuer ID.
#
# The Admin-role ASC API key lets EAS create the distribution cert /
# provisioning profile AND the App Store Connect app record on first run, so
# there is nothing to set up by hand first.

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Cloud build + TestFlight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        working-directory: apps/mobile
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > asc-key.p8

      # Inject the ASC submit credentials into eas.json at runtime (jq is
      # preinstalled on the runner). Keeps the Key ID / Issuer ID out of git —
      # they come from secrets only. The committed eas.json keeps just the team id.
      - name: Configure submit credentials
        working-directory: apps/mobile
        run: |
          jq --arg keyId "${{ secrets.APPLE_ASC_KEY_ID }}" \
             --arg issuerId "${{ secrets.APPLE_ASC_ISSUER_ID }}" \
             '.submit.production.ios += {
                ascApiKeyPath: "./asc-key.p8",
                ascApiKeyId: $keyId,
                ascApiKeyIssuerId: $issuerId
              }' eas.json > eas.json.tmp && mv eas.json.tmp eas.json

      # Cloud build on Expo's servers + auto-submit to TestFlight in one step.
      # EXPO_ASC_* let EAS provision the distribution cert/profile non-interactively.
      - name: Build (cloud) + submit to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_ASC_API_KEY_PATH: ./asc-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit

      - name: Clean up secrets
        if: always()
        working-directory: apps/mobile
        run: rm -f asc-key.p8
