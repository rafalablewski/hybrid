name: Mobile — build & TestFlight

# Builds HYBRID for iOS on a GitHub cloud Mac and uploads it to TestFlight.
#
#  • NO Expo build service — `expo prebuild` is only local code-generation
#    (no Expo account/token).
#  • NO manual certificate handling — `codemagic-cli-tools` (an open-source
#    Apple-signing helper, NOT the codemagic.io service) creates and reuses the
#    Apple Distribution certificate + provisioning profile automatically from
#    your App Store Connect API key.
#  • Free + unlimited, because the repo is public (no build quota).
#
# Trigger: GitHub → Actions → "Mobile — build & TestFlight" → Run workflow
# (or push a tag like `mobile-v1.0.1`). Build numbers auto-increment.
#
# ── Required repo secrets (Settings → Secrets and variables → Actions) ────────
#   APPLE_ASC_API_KEY_P8     Full contents of your App Store Connect API .p8.
#   APPLE_ASC_KEY_ID         The .p8 Key ID — ZRWGCS2PUS.
#   APPLE_ASC_ISSUER_ID      App Store Connect → Integrations → Issuer ID.
#   APPLE_CERT_PRIVATE_KEY   A signing key you generate ONCE (no Keychain, no
#                            .p12):  openssl genrsa 2048 | pbcopy  → paste it.
#                            The tooling uses it to create + reuse the cert.
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  Public Supabase anon key (baked into bundle).

on:
  workflow_dispatch:
    inputs:
      with_targets:
        description: "Include the widget + Watch app targets (needs the extra bundle ids + App Group in the portal — see the signing step)"
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build + TestFlight
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPLE_ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.APPLE_CERT_PRIVATE_KEY }}
      BUNDLE_ID: com.hybriddomain.xyz
      # Widget + Watch app targets are OPT-IN (workflow_dispatch input): each is
      # its own bundle id + provisioning profile + the shared App Group, so the
      # plain release path stays untouched until they exist in the portal.
      WITH_APPLE_TARGETS: ${{ inputs.with_targets && '1' || '' }}
      WIDGET_BUNDLE_ID: com.hybriddomain.xyz.widget
      WATCH_BUNDLE_ID: com.hybriddomain.xyz.watchkitapp
      APP_GROUP_ID: group.com.hybriddomain.xyz
    steps:
      - uses: actions/checkout@v7

      # Use the newest Xcode on the runner (the default 16.4 is older than the
      # Xcode the project was prebuilt/verified with, which breaks native pods).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # A build that ships a mismatched Expo set compiles, signs, uploads and
      # processes cleanly, then aborts in dyld on the tester's phone before the
      # first frame — see build 82223058 and apps/mobile/lib/expo-alignment.test.ts.
      # Ten seconds here, or a dead build and a TestFlight round trip.
      - name: Check the Expo SDK set is aligned
        working-directory: apps/mobile
        run: npx vitest run lib/expo-alignment.test.ts

      - name: Install signing helper (codemagic-cli-tools — not the codemagic.io service)
        run: pipx install codemagic-cli-tools

      # With targets on, prebuild also generates the widget + Watch targets
      # (@bacons/apple-targets reads targets/*). No team id is passed here on
      # purpose: `xcode-project use-profiles` below assigns the team + profile
      # to EVERY target from the fetched signing files, which is its whole job.
      - name: Generate native iOS project (local expo prebuild — no Expo account)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Set up Apple signing automatically (from the API key)
        run: |
          keychain initialize

          # The App ID must carry every capability the entitlements request.
          # Apple bakes an App ID's capabilities into a provisioning profile at
          # CREATION time, so a profile minted before a capability was enabled
          # stays ACTIVE-but-stale, gets reused by fetch-signing-files, and
          # fails the archive ("Provisioning profile doesn't include the
          # HealthKit capability" — runs 29661636610 / 29662930353). Enforce
          # every capability here (no manual portal toggle) and delete this
          # app's App Store profiles that predate any of them; a fresh one is
          # minted below in seconds.
          #
          # TWO capabilities now. PUSH_NOTIFICATIONS joined HEALTHKIT when the
          # three retention notifications shipped: expo-notifications requests
          # the `aps-environment` entitlement (app.json sets mode=production),
          # and an App ID without Push Notifications produces a profile that
          # does not include it — the identical stale-profile archive failure,
          # for a different capability. Enabling it here is also what retired
          # the build plugin that used to DELETE the aps-environment entitlement
          # so an archive could pass without the capability: that plugin is
          # gone, and remote push is why.
          BUNDLE_RESOURCE_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | jq -r '.[0].id')

          # $1 = the App Store Connect API value (what `capabilities` reports),
          # $2… = the spellings to try on `enable-capabilities`. The CLI takes the
          # DISPLAY name (hence "HealthKit" rather than HEALTHKIT), so the display
          # form goes first and the raw API value is a fallback — a spelling that
          # neither accepts must fail the job loudly here rather than surface as
          # an opaque archive error twenty minutes later.
          ensure_capability() {
            local api="$1"; shift
            if app-store-connect bundle-ids capabilities "$BUNDLE_RESOURCE_ID" --json \
                | jq -e --arg cap "$api" 'map(select(.attributes.capabilityType == $cap)) | length > 0' >/dev/null; then
              echo "Capability $api already enabled"
              return 0
            fi
            for name in "$@"; do
              if app-store-connect bundle-ids enable-capabilities "$BUNDLE_RESOURCE_ID" --capability "$name"; then
                echo "Enabled capability $api (as '$name')"
                return 0
              fi
            done
            echo "::error::Could not enable the $api capability on $BUNDLE_ID — tried: $*"
            return 1
          }
          ensure_capability HEALTHKIT HealthKit HEALTHKIT
          ensure_capability PUSH_NOTIFICATIONS "Push Notifications" PUSH_NOTIFICATIONS PushNotifications

          # A profile is stale if it is missing ANY entitlement the app requests.
          PROFILES_JSON=$(app-store-connect bundle-ids profiles --bundle-ids "$BUNDLE_RESOURCE_ID" --type IOS_APP_STORE --json)
          for PROFILE_ID in $(echo "$PROFILES_JSON" | jq -r '.[].id'); do
            CONTENT=$(echo "$PROFILES_JSON" | jq -r --arg id "$PROFILE_ID" '.[] | select(.id == $id) | .attributes.profileContent' | base64 -d)
            for ENTITLEMENT in com.apple.developer.healthkit aps-environment; do
              if ! echo "$CONTENT" | grep -aq "$ENTITLEMENT"; then
                echo "Deleting stale profile $PROFILE_ID (missing $ENTITLEMENT)"
                app-store-connect profiles delete "$PROFILE_ID"
                break
              fi
            done
          done

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

          # ── Widget + Watch app (opt-in, see the with_targets input) ─────────
          # Each embedded target needs its own App ID + App Store profile, and
          # the widget shares data with the app through the App Group. The
          # registrations are idempotent (`|| true` where the resource already
          # exists). ONE THING the API key cannot do here: ASSIGNING the App
          # Group to an App ID needs capabilitySettings the codemagic CLI can't
          # express — if the archive fails with "doesn't include the
          # com.apple.security.application-groups entitlement", create the
          # group and tick it for BOTH the app and the widget App IDs once in
          # developer.apple.com → Identifiers, delete the stale profiles, and
          # re-run; everything else below stays automated.
          if [ "$WITH_APPLE_TARGETS" = "1" ]; then
            app-store-connect bundle-ids register "$WIDGET_BUNDLE_ID" --name "HYBRID Widget" --platform IOS || true
            app-store-connect bundle-ids register "$WATCH_BUNDLE_ID" --name "HYBRID Watch" --platform IOS || true
            for EXTRA_ID in "$WIDGET_BUNDLE_ID" "$WATCH_BUNDLE_ID"; do
              app-store-connect fetch-signing-files "$EXTRA_ID" \
                --platform IOS \
                --type IOS_APP_STORE \
                --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
                --create
            done
          fi

          keychain add-certificates
          cd apps/mobile/ios && xcode-project use-profiles

      - name: Set an always-increasing build number
        working-directory: apps/mobile/ios
        run: |
          # CFBundleVersion must be strictly HIGHER than the last upload or App
          # Store Connect 409s ("bundle version must be higher than … '2'"). The
          # old step queried get-latest-testflight-build-number, but that was
          # returning empty → $((0 + 1)) → build "1" → rejected every run.
          #
          # Use a value that always increases ON ITS OWN: whole SECONDS since
          # 2024-01-01 UTC (~78M today). It's monotonic with the wall clock,
          # always far above any previously-uploaded build, and needs no API call
          # or stored state — so a re-run or retry can never reuse a build number.
          # 1704067200 = 2024-01-01T00:00:00Z.
          #
          # THIS STEP IS THE ONLY PLACE THE CLOCK MAY BE READ, and it matters that
          # it runs AFTER `expo prebuild`. app.config.js used to compute the same
          # value, which meant the clock was inside the Expo config — and the
          # config is what `runtimeVersion: {policy: "fingerprint"}` hashes. The
          # project therefore had a different runtime version every second, so an
          # `eas update` published from it carried a fingerprint no installed build
          # could ever have: it would succeed and reach nothing. The config is
          # deterministic now (apps/mobile/lib/build-number.test.ts fails if that
          # regresses); do not move this back into it. The archive picks the number
          # up from here because agvtool rewrites the generated project in place.
          BUILD=$(( $(date -u +%s) - 1704067200 ))
          echo "Setting CFBundleVersion to $BUILD"
          agvtool new-version -all "$BUILD"
          # Carried forward so the post-upload steps can find THIS build in App
          # Store Connect (the version string never changes, so the build number
          # is the only thing that identifies a run).
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Build the IPA
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: xcode-project build-ipa --workspace HYBRID.xcworkspace --scheme HYBRID --disable-xcpretty

      # Upload only — the build is then available for INTERNAL TestFlight
      # testing immediately (no beta review). External testers would additionally
      # need the Beta App Review info filled in App Store Connect + `--testflight`
      # here to submit for review; not needed for internal testing.
      - name: Upload to TestFlight
        run: |
          app-store-connect publish \
            --path "$(find apps/mobile/ios/build -name '*.ipa' | head -n 1)"

      # ── Green must mean INSTALLABLE, not "handed to Apple" ──────────────────
      # `publish` returns as soon as altool finishes the transfer, which is not
      # the same thing as the build being available in TestFlight: App Store
      # Connect then PROCESSES it (validation, entitlements, encryption), which
      # takes anywhere from a few minutes to the better part of an hour, and can
      # fail afterwards — by email, never back to this run. So a green run used
      # to tell you nothing about whether the build had actually landed, and the
      # only way to find out was to keep opening TestFlight.
      #
      # This step closes that gap: it polls until Apple finishes, reports the
      # state TestFlight itself shows, and FAILS if processing fails or never
      # completes. It also names the exact build to look for, because the
      # version string never changes between releases — every build is 1.0.0,
      # and the build NUMBER is the only thing that tells two of them apart.
      - name: Wait for App Store Connect to finish processing
        run: |
          set -euo pipefail

          # `|| true` on every API pipeline in this step: under `set -e` +
          # `pipefail` a non-zero CLI aborts before the explicit check below can
          # give a useful message, turning a diagnosable state into a bare
          # "exit code 1".
          APP_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json 2>/dev/null \
            | jq -r '.[0].id // empty' || true)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::No app in App Store Connect for $BUNDLE_ID"
            exit 1
          fi

          # Apple needs a moment before a freshly uploaded build is even
          # queryable, so "not found yet" is a normal early state, not an error.
          DEADLINE=$(( $(date -u +%s) + 45 * 60 ))
          BUILD_ID=""
          STATE=""
          while :; do
            BUILD_JSON=$(app-store-connect builds list \
              --app-id "$APP_ID" --build-version-number "$BUILD" --json 2>/dev/null || echo '[]')
            BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id // empty')
            STATE=$(echo "$BUILD_JSON" | jq -r '.[0].attributes.processingState // "NOT_FOUND"')

            case "$STATE" in
              VALID)
                echo "Processing finished: $STATE"
                break
                ;;
              INVALID|FAILED)
                echo "::error::App Store Connect rejected build $BUILD ($STATE). \
          Check the email from Apple for the reason — this never comes back through the API."
                exit 1
                ;;
            esac

            if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Build $BUILD still '$STATE' after 45 minutes. \
          It may still land on its own; check App Store Connect."
              exit 1
            fi
            echo "  $STATE — waiting…"
            sleep 30
          done

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

          # What TestFlight itself will show. READY_FOR_BETA_TESTING is the one
          # that means "installable"; anything else is worth seeing in the log.
          #
          # DIAGNOSTIC ONLY — it must never fail the step. The build reaching
          # VALID above IS the result; this is commentary on it. Apple publishes
          # a build's beta detail slightly AFTER the build itself goes valid, so
          # a lookup fired straight out of the loop can 404 — and the first cut
          # of this let that non-zero exit kill an otherwise perfect run
          # (job 90665506474: "Processing finished: VALID" then exit 1). Retry
          # briefly for the eventual consistency, then report UNKNOWN and move
          # on rather than failing a build that is sitting in App Store Connect.
          INTERNAL=UNKNOWN
          for _ in 1 2 3 4 5 6; do
            BETA_JSON=$(app-store-connect builds beta-details "$BUILD_ID" --json 2>/dev/null || true)
            FOUND=$(printf '%s' "$BETA_JSON" | jq -r '.attributes.internalBuildState // empty' 2>/dev/null || true)
            if [ -n "$FOUND" ]; then INTERNAL="$FOUND"; break; fi
            sleep 10
          done
          echo "Internal build state: $INTERNAL"
          echo "INTERNAL_STATE=$INTERNAL" >> "$GITHUB_ENV"

      # "What to Test" in TestFlight, set from the commit that triggered the
      # build. Without it every entry is an unlabelled 1.0.0 and the only way to
      # tell which one you are installing is to decode the build number.
      - name: Label the build in TestFlight
        continue-on-error: true
        run: |
          # printf, not a multi-line quoted literal: the latter would carry this
          # file's YAML indentation into the note TestFlight actually displays.
          NOTES=$(printf '%s\n\n%s on %s' \
            "$(git log -1 --pretty=%s)" "${GITHUB_SHA:0:7}" "$GITHUB_REF_NAME")
          app-store-connect builds add-beta-test-info "$BUILD_ID" \
            --locale en-US --whats-new "$NOTES"

      # ── The step that actually gets it onto a phone ────────────────────────
      # A build that is VALID but attached to no beta group is INVISIBLE in
      # TestFlight and indistinguishable from one that never arrived: green run,
      # healthy API, build list simply does not grow. That is the state builds
      # 81278222 and 81281267 landed in while every earlier build appeared
      # normally — so this is not hypothetical, it is what went wrong.
      #
      # The codemagic CLI can add a build to a group BY NAME but cannot LIST
      # groups, and a name we have to be told in advance is precisely what makes
      # this fail silently. So this talks to the REST API: it prints every group
      # with the two attributes that decide visibility (isInternalGroup,
      # hasAccessToAllBuilds) — that listing is the diagnosis — and attaches the
      # build to each internal group that does not already have it.
      - name: Distribute to the internal testers
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          # Own venv: PyJWT lives inside the pipx install of the signing helper,
          # not on the runner's python, and installing into the system one is
          # both fragile and rude.
          python3 -m venv /tmp/ascvenv
          /tmp/ascvenv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography
          /tmp/ascvenv/bin/python .github/scripts/testflight-distribute.py

      - name: Summary
        if: always()
        run: |
          {
            echo "### TestFlight"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Install | **HYBRID 1.0.0 (${BUILD:-?})** |"
            echo "| Internal state | \`${INTERNAL_STATE:-unknown}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\` |"
            echo
            if [ "${INTERNAL_STATE:-}" != "READY_FOR_BETA_TESTING" ]; then
              echo "> Processing finished, but the internal state is \`${INTERNAL_STATE:-unknown}\`"
              echo "> rather than \`READY_FOR_BETA_TESTING\`. If it does not appear for"
              echo "> testers, check that the build is assigned to an internal group."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

