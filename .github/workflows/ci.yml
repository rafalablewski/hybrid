name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # tsc across @hybrid/core, @hybrid/web AND @hybrid/mobile — the mobile
      # typecheck is the gap Vercel's web-only build doesn't cover.
      - name: Typecheck
        run: pnpm typecheck

      # @hybrid/core engine unit tests (vitest).
      - name: Test
        run: pnpm test
