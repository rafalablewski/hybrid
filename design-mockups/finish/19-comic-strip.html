<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 19 Comic Strip</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:50px 22px 24px;display:flex;flex-direction:column}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);text-align:center;margin-bottom:14px}
.panel{position:relative;border:2px solid var(--chalk);border-radius:14px;padding:18px;margin-bottom:12px;min-height:120px;display:flex;align-items:center;gap:14px;overflow:hidden}
.panel .num{position:absolute;top:8px;left:10px;font-family:'Space Mono';font-size:11px;color:var(--ash)}
.panel .em{font-size:56px}
.panel .cap{font-weight:800;font-size:18px;line-height:1.15}
.panel .cap b{color:var(--lime)}
.p1{background:radial-gradient(circle at 80% 20%,rgba(196,240,53,.12),transparent 60%)}
.p2{background:radial-gradient(circle at 20% 80%,rgba(91,167,255,.12),transparent 60%)}
.p3{background:radial-gradient(circle at 50% 50%,rgba(196,240,53,.16),transparent 65%);justify-content:center;text-align:center}
.p3 .big{font-size:40px;font-weight:900}
.p3 .big b{color:var(--lime)}
.boom{position:absolute;right:14px;top:14px;font-family:'Space Mono';font-weight:700;font-size:12px;color:var(--ink);background:var(--lime);padding:4px 10px;border-radius:6px;transform:rotate(6deg)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:8px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.row2{display:flex;gap:10px;margin-top:10px}.row2 .btn{flex:1}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line)}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Push Day A · the story</div>
  <div class="panel p1"><span class="num">1</span><div class="em">🏋️</div><div class="cap">You moved <b>4.2 tonnes</b> today.</div></div>
  <div class="panel p2"><span class="num">2</span><div class="em">🚗</div><div class="cap">That's about <b>a small car…</b></div></div>
  <div class="panel p3"><span class="num">3</span><span class="boom">PR ×2!</span><div class="big">…and you set <b>2 PRs.</b> 🤯</div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share the strip</button>
  <div class="row2"><button class="btn ghost">★ Routine</button><button class="btn an">Analysis →</button></div>
</div></div></body></html>
