<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Mesh Minimal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--ink:#0a0c0a;--lime:#c4f035;--chalk:#f4f6f2;--ash:#8b8f86}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--ink)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:
   radial-gradient(90% 60% at 12% 6%,#e9ff8f,transparent 55%),
   radial-gradient(90% 60% at 96% 14%,#bfeef7,transparent 52%),
   radial-gradient(100% 70% at 50% 104%,#d9c8f5,transparent 60%),
   radial-gradient(80% 60% at 86% 80%,#c4f035,transparent 60%),
   #eef0e8}
.soft{position:absolute;inset:0;backdrop-filter:blur(0px)}
.wrap{position:absolute;inset:0;padding:60px 32px 28px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:.3em;font-size:15px}
.badge{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;color:var(--ink);border:1.5px solid var(--ink);padding:5px 11px;border-radius:999px;font-weight:600}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#3c4438}
.big{font-weight:900;font-size:152px;line-height:.78;letter-spacing:-.06em;margin-top:10px}
.big small{font-weight:600;font-size:46px}
.sub{font-weight:700;font-size:22px;margin-top:18px;letter-spacing:-.01em;color:#1d2119}
.stats{display:flex;margin-top:28px;border-top:1.5px solid rgba(12,13,12,.2)}
.st{flex:1;padding:16px 2px;border-right:1.5px solid rgba(12,13,12,.16)}
.st:last-child{border-right:none}
.st b{display:block;font-weight:800;font-size:26px;letter-spacing:-.02em}
.st span{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.1em;color:#4a5044;text-transform:uppercase;margin-top:4px;display:block}
.share{width:100%;border:none;border-radius:999px;padding:18px;font-family:inherit;font-weight:800;font-size:16px;background:var(--ink);color:var(--lime);cursor:pointer;margin-top:26px}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1.5px solid rgba(12,13,12,.3);background:transparent;border-radius:999px;padding:13px;font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:#4a5044;padding:14px 0 0}
</style></head>
<body><div class="phone"><div class="soft"></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="badge">✓ Session</div></div>
    <div class="mid">
      <div class="kick">You moved</div>
      <div class="big">20<small>.0t</small></div>
      <div class="sub">Night workout, done.</div>
      <div class="stats">
        <div class="st"><b>1</b><span>Minutes</span></div>
        <div class="st"><b>2</b><span>Sets</span></div>
        <div class="st"><b>20.0t</b><span>Volume</span></div>
      </div>
    </div>
    <button class="share">↗ Share to story</button>
    <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
    <div class="back">Done — back to Today</div>
  </div>
</div></body></html>
