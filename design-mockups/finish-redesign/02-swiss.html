<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Swiss</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--paper:#f2f1ec;--ink:#0c0d0c;--red:#e0625e;--lime:#c4f035;--ash:#6e7068;--line:#19191720}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a18;font-family:Archivo,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--ink)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #2a2a27;box-shadow:0 40px 120px -30px #000;background:var(--paper)}
.wrap{height:100%;overflow-y:auto;padding:0;display:flex;flex-direction:column}
.head{padding:64px 28px 0;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink)}
.head .l{font-family:'Archivo Narrow';font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.head .r{font-family:'JetBrains Mono';font-size:11px;color:var(--ash);text-align:right;padding-bottom:14px}
.head .l{padding-bottom:14px}
.tick{width:34px;height:34px;background:var(--lime);display:inline-grid;place-items:center;border-radius:50%;font-size:18px;margin-bottom:18px}
.h1{padding:26px 28px 0;font-weight:900;font-size:64px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
.sub{padding:14px 28px 24px;font-family:'Archivo Narrow';font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ash);border-bottom:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr}
.cell{padding:22px 28px 26px;border-right:1px solid var(--line)}
.cell:last-child{border-right:none}
.cell .n{font-weight:800;font-size:40px;line-height:.9;letter-spacing:-.03em}
.cell.acc .n{color:var(--red)}
.cell .k{font-family:'Archivo Narrow';font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:10px;color:var(--ash)}
.rule{height:2px;background:var(--ink)}
.dots{display:flex;gap:6px;padding:18px 28px}
.dot{width:10px;height:10px;border:1.5px solid var(--ink)}
.dot.on{background:var(--ink)}
.spacer{flex:1;min-height:6px}
.acts{padding:0 28px 8px}
.btn{display:block;width:100%;border:2px solid var(--ink);background:transparent;padding:16px;font-family:'Archivo Narrow';font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:left;margin-top:-2px}
.btn.share{background:var(--lime)}
.btn.row{display:flex;justify-content:space-between}
.foot{padding:14px 28px 26px;border-top:2px solid var(--ink);font-family:'JetBrains Mono';font-size:11px;color:var(--ash);display:flex;justify-content:space-between}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="head"><div class="l"><div class="tick">✓</div>HYBRID / Session</div><div class="r">22.06.2026<br>22:41</div></div>
  <div class="h1">Session<br>complete</div>
  <div class="sub">Night workout</div>
  <div class="grid">
    <div class="cell"><div class="n">1</div><div class="k">Minutes</div></div>
    <div class="cell"><div class="n">2</div><div class="k">Sets</div></div>
    <div class="cell acc"><div class="n">20.0</div><div class="k">Tonnes</div></div>
  </div>
  <div class="rule"></div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="spacer"></div>
  <div class="acts">
    <button class="btn share row"><span>↗ Share to story</span><span>01</span></button>
    <button class="btn row"><span>★ Save as routine</span><span>02</span></button>
    <button class="btn row"><span>See your analysis</span><span>→</span></button>
  </div>
  <div class="foot"><span>DONE — BACK TO TODAY</span><span>FIG. 01</span></div>
</div></div></body></html>
