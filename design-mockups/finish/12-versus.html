<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 12 You vs The Object</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--red:#ff5a5a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:50px 20px 24px;display:flex;flex-direction:column}
.top{text-align:center;font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.versus{position:relative;display:flex;flex-direction:column;gap:0;margin:14px 0;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.side{display:flex;align-items:center;gap:14px;padding:24px 20px}
.you{background:linear-gradient(90deg,rgba(196,240,53,.16),transparent)}
.them{background:linear-gradient(270deg,rgba(255,90,90,.14),transparent);flex-direction:row-reverse;text-align:right}
.side .em{font-size:60px}
.side .lbl{font-family:'Space Mono';font-size:11px;letter-spacing:.12em;color:var(--ash)}
.side .wt{font-weight:900;font-size:34px;line-height:1}
.you .wt{color:var(--lime)}
.vsbadge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:grid;place-items:center;font-weight:900;font-size:18px}
.bars{margin-top:2px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
.win{text-align:center;margin:14px 0 2px;font-weight:900;font-size:22px}
.win b{color:var(--lime)}
.sub{text-align:center;font-family:'Space Mono';font-size:12px;color:var(--ash);margin-bottom:6px}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.row2{display:flex;gap:10px;margin-top:10px}.row2 .btn{flex:1}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line)}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="top">Push Day A · Complete</div>
  <div class="versus">
    <div class="side you"><div class="em">🏋️</div><div><div class="lbl">YOU TODAY</div><div class="wt">4.2 t</div></div></div>
    <div class="side them"><div class="em">🚗</div><div><div class="lbl">A SMALL CAR</div><div class="wt">~1.5 t</div></div></div>
    <div class="vsbadge">VS</div>
  </div>
  <div class="bars">
    <div class="bar"><i style="width:100%;background:var(--lime)"></i></div>
    <div class="bar"><i style="width:36%;background:var(--red)"></i></div>
  </div>
  <div class="win">WINNER: <b>YOU</b> 🏆</div>
  <div class="sub">you out-lifted a car by 2.8×</div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share the win</button>
  <div class="row2"><button class="btn ghost">★ Routine</button><button class="btn an">Analysis →</button></div>
</div></div></body></html>
