<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 11 Glass — Fun First</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--chalk:#f4f6f2;--ash:#aeb4ac;--lime:#c4f035}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000;
  background:radial-gradient(circle at 18% 8%,#1b3a2a,transparent 52%),radial-gradient(circle at 92% 26%,#243a66,transparent 55%),radial-gradient(circle at 50% 104%,#3a2a55,transparent 55%),#06080a}
.wrap{height:100%;overflow-y:auto;padding:56px 20px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.glass{backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 60px -22px rgba(0,0,0,.65)}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);margin-bottom:8px}
.sub{font-size:14px;color:var(--ash);margin-bottom:18px}
.hero{width:100%;padding:34px 22px;margin-bottom:14px}
.emoji{font-size:96px;line-height:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.punch{font-weight:900;font-size:30px;letter-spacing:-.02em;line-height:1.08;margin-top:18px}
.punch b{color:var(--lime)}
.cap{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:10px}
.strip{display:flex;width:100%;padding:14px 8px;margin-bottom:auto}
.s{flex:1;text-align:center}.s b{display:block;font-size:20px;font-weight:900}.s span{font-family:'Space Mono';font-size:9px;color:var(--ash)}
.btn{width:100%;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;border:1px solid rgba(255,255,255,.18)}
.share{background:rgba(196,240,53,.92);color:#0a0c0a;border:none;box-shadow:0 8px 30px -6px rgba(196,240,53,.55)}
.ghost{background:rgba(255,255,255,.08);color:var(--chalk);margin-top:10px}
.an{background:transparent;color:var(--chalk);opacity:.8;margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Workout complete · Push Day A</div>
  <div class="glass hero">
    <div class="emoji">🚗</div>
    <div class="punch">You just lifted<br>a <b>small car.</b></div>
    <div class="cap">4.2 t moved today</div>
  </div>
  <div class="glass strip">
    <div class="s"><b>47</b><span>MIN</span></div>
    <div class="s"><b>18</b><span>SETS</span></div>
    <div class="s"><b>2 🏆</b><span>PRS</span></div>
  </div>
  <button class="btn share">↗ Share the flex</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div></body></html>
