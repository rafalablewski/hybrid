<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Ticket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{--ink:#0a0c0a;--lime:#c4f035;--chalk:#f4f6f2;--ash:#8b8f86}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:radial-gradient(130% 60% at 50% 0,#15170f,#070807 55%)}
.wrap{position:absolute;inset:0;padding:46px 24px 24px;display:flex;flex-direction:column}
.brandrow{display:flex;justify-content:space-between;align-items:center;color:var(--ash);font-family:'JetBrains Mono';font-size:11px;letter-spacing:.12em}
.brandrow b{color:var(--chalk);font-weight:900;letter-spacing:.3em}
.ticket{flex:1;margin-top:16px;background:var(--ink);border:1px solid #2a2d2a;border-radius:22px;position:relative;display:flex;flex-direction:column}
.tk-top{padding:24px 24px 18px}
.label{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.h1{font-weight:900;font-size:34px;letter-spacing:-.03em;margin-top:8px}
.meta{font-family:'JetBrains Mono';font-size:11px;color:var(--ash);margin-top:8px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:22px 24px}
.g .k{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.g .v{font-weight:900;font-size:30px;letter-spacing:-.02em;margin-top:4px}
.g.hero{grid-column:1/3}
.g.hero .v{font-size:62px;color:var(--lime)}
.perf{position:relative;height:28px}
.perf:before,.perf:after{content:"";position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(130% 60% at 50% 0,#15170f,#070807 55%)}
.perf:before{left:-14px}.perf:after{right:-14px}
.perf .dash{position:absolute;left:18px;right:18px;top:50%;border-top:2px dashed #2a2d2a}
.stub{padding:18px 24px 22px;display:flex;justify-content:space-between;align-items:center}
.stub .barcode{display:flex;gap:3px;align-items:flex-end;height:40px}
.stub .barcode i{width:3px;background:var(--chalk)}
.stub .seat{text-align:right}
.stub .seat span{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);display:block}
.stub .seat b{font-weight:900;font-size:20px}
.acts{margin-top:16px}
.share{width:100%;border:none;border-radius:16px;padding:16px;font-family:inherit;font-weight:800;font-size:16px;background:var(--lime);color:#06270a;cursor:pointer}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1px solid #2a2d2a;background:transparent;border-radius:16px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--chalk);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--ash);padding:12px 0 0}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="brandrow"><span>BOARDING PASS</span><b>HYBRID</b><span>✓ DONE</span></div>
  <div class="ticket">
    <div class="tk-top">
      <div class="label">Session complete</div>
      <div class="h1">Night workout</div>
      <div class="meta">22 JUN 2026 · 22:41 · ✎ NAME IT</div>
    </div>
    <div class="grid">
      <div class="g"><div class="k">Minutes</div><div class="v">1</div></div>
      <div class="g"><div class="k">Sets</div><div class="v">2</div></div>
      <div class="g hero"><div class="k">Total volume moved</div><div class="v">20.0 t</div></div>
    </div>
    <div class="perf"><div class="dash"></div></div>
    <div class="stub">
      <div class="barcode"><i style="height:60%"></i><i style="height:100%"></i><i style="height:40%"></i><i style="height:80%"></i><i style="height:50%"></i><i style="height:100%"></i><i style="height:35%"></i><i style="height:70%"></i><i style="height:90%"></i><i style="height:45%"></i><i style="height:100%"></i><i style="height:60%"></i></div>
      <div class="seat"><span>Athlete</span><b>YOU</b></div>
    </div>
  </div>
  <div class="acts">
    <button class="share">↗ Share to story</button>
    <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
  </div>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
