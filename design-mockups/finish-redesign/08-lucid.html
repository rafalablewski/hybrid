<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Lucid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap');
:root{--chalk:#f4f6f2;--ash:#a7b0ac;--lime:#c4f035;--blue:#7fd4e8;--violet:#c9a9f0;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #1d1d1d;box-shadow:0 40px 120px -30px #000;
  background:#05060a}
.aura{position:absolute;inset:0;background:
  radial-gradient(60% 38% at 50% 0%,rgba(127,212,232,.28),transparent 70%),
  radial-gradient(70% 40% at 20% 30%,rgba(201,169,240,.20),transparent 70%),
  radial-gradient(80% 50% at 80% 65%,rgba(196,240,53,.16),transparent 70%),
  radial-gradient(90% 60% at 50% 110%,rgba(255,255,255,.06),transparent 70%)}
.wrap{position:relative;height:100%;overflow-y:auto;padding:78px 28px 30px;display:flex;flex-direction:column;align-items:center}
.tick{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:26px;color:var(--chalk);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.kick{font-family:'JetBrains Mono';font-weight:300;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--ash);margin-top:26px}
.h1{font-weight:300;font-size:38px;letter-spacing:-.01em;margin-top:14px;text-align:center}
.h1 b{font-weight:600}
.name{font-size:14px;color:var(--ash);margin-top:10px}
.panel{width:100%;margin-top:30px;padding:28px 24px;border-radius:28px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 60px -30px rgba(0,0,0,.7)}
.ey{font-family:'JetBrains Mono';font-weight:300;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.stat-row{display:flex;margin-top:22px}
.stat{flex:1;text-align:center;position:relative}
.stat+.stat:before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.stat b{display:block;font-weight:300;font-size:34px;letter-spacing:-.02em}
.stat b small{font-size:15px;color:var(--ash)}
.stat span{font-family:'JetBrains Mono';font-weight:300;font-size:9px;letter-spacing:.14em;color:var(--ash)}
.dots{display:flex;gap:8px;margin:24px 0 6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dot.on{width:24px;background:linear-gradient(90deg,var(--blue),var(--lime))}
.spacer{flex:1;min-height:6px}
.btn{width:100%;border:none;border-radius:999px;padding:17px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.share{background:linear-gradient(180deg,#d6f95e,var(--lime));color:#0a0c0a;box-shadow:0 14px 40px -10px rgba(196,240,53,.55)}
.ghost{background:var(--glass);color:var(--chalk);border:1px solid var(--line);margin-top:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.analysis{background:transparent;color:var(--chalk);margin-top:14px;font-weight:400;opacity:.85;font-size:14px}
.back{color:var(--ash);font-family:'JetBrains Mono';font-weight:300;font-size:12px;letter-spacing:.08em;padding:14px 0 2px}
</style></head>
<body><div class="phone"><div class="aura"></div><div class="wrap">
  <div class="tick">✓</div>
  <div class="kick">Session complete</div>
  <div class="h1">Night <b>workout</b></div>
  <div class="name">✎ Name this workout (optional)</div>
  <div class="panel">
    <div class="ey">Overview</div>
    <div class="stat-row">
      <div class="stat"><b>1</b><span>MINUTES</span></div>
      <div class="stat"><b>2</b><span>SETS</span></div>
      <div class="stat"><b>20.0<small> t</small></b><span>VOLUME</span></div>
    </div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share to story</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
