<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Japandi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--paper:#ece7dd;--paper2:#f4f0e7;--sumi:#26241f;--clay:#6f6a5e;--sage:#9aa57e;--lime:#c4f035}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#171612;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--sumi)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #2a2823;box-shadow:0 40px 120px -30px #000;
  background:var(--paper);
  background-image:radial-gradient(circle at 18% 12%,rgba(154,165,126,.18),transparent 45%),radial-gradient(circle at 88% 0%,rgba(196,240,53,.10),transparent 40%)}
.wrap{height:100%;overflow-y:auto;padding:78px 34px 30px;display:flex;flex-direction:column}
.enso{width:78px;height:78px;border-radius:50%;border:2px solid var(--sumi);border-right-color:transparent;display:grid;place-items:center;transform:rotate(-18deg);margin-bottom:30px}
.enso span{transform:rotate(18deg);font-size:26px;color:var(--sumi)}
.kicker{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--clay)}
.h1{font-weight:400;font-size:38px;line-height:1.05;letter-spacing:-.01em;margin-top:14px}
.h1 b{font-weight:700}
.name{font-size:15px;color:var(--clay);margin-top:12px}
.rename{margin-top:22px;border:1px dashed #c2bcab;border-radius:12px;padding:13px 16px;font-size:13px;color:var(--clay);font-family:'JetBrains Mono'}
.stats{margin-top:30px;border-top:1px solid #d6d0c1}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:17px 2px;border-bottom:1px solid #d6d0c1}
.row .lab{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay)}
.row .val{font-weight:600;font-size:26px}
.row .val small{font-size:14px;color:var(--clay);font-weight:500}
.dots{display:flex;gap:7px;margin:26px 0 22px}
.dot{width:6px;height:6px;border-radius:50%;background:#cfc8b8}
.dot.on{width:22px;border-radius:3px;background:var(--sage)}
.spacer{flex:1;min-height:8px}
.btn{width:100%;border-radius:14px;padding:16px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;border:1px solid transparent;text-align:center}
.share{background:var(--sumi);color:var(--paper2)}
.share b{color:var(--lime)}
.ghost{background:transparent;color:var(--sumi);border-color:#c7c0af;margin-top:11px}
.analysis{background:transparent;color:var(--clay);margin-top:16px;font-weight:500;font-size:14px}
.back{text-align:center;color:var(--clay);font-family:'JetBrains Mono';font-size:12px;padding:18px 0 4px;letter-spacing:.04em}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="enso"><span>✓</span></div>
  <div class="kicker">Session complete</div>
  <div class="h1">Night<br><b>workout.</b></div>
  <div class="name">Quiet work, well done.</div>
  <div class="rename">✎ Name this workout (optional)</div>
  <div class="stats">
    <div class="row"><span class="lab">Minutes</span><span class="val">1</span></div>
    <div class="row"><span class="lab">Sets</span><span class="val">2</span></div>
    <div class="row"><span class="lab">Volume</span><span class="val">20.0<small> t</small></span></div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share to <b>story</b></button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
