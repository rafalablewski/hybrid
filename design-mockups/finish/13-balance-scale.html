<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 13 Balance Scale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--surface:#141814;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:radial-gradient(circle at 50% 16%,#15201a,transparent 60%),var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.h1{font-weight:900;font-size:24px;margin:8px 0 6px}
.scene{width:100%;margin:6px 0}
.tip{transform-origin:50% 50%;transform:rotate(-9deg);transition:transform 1s}
.cap{font-weight:900;font-size:26px;line-height:1.1;margin-top:6px}
.cap b{color:var(--lime)}
.sub{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:8px}
.stats{display:flex;gap:10px;width:100%;margin-top:18px}
.s{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px}
.s b{display:block;font-size:22px;font-weight:900}.s span{font-family:'Space Mono';font-size:9px;color:var(--ash)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Fun fact</div>
  <div class="h1">Today you outweigh…</div>
  <div class="scene">
    <svg viewBox="0 0 320 200" width="100%">
      <g class="tip">
        <line x1="40" y1="60" x2="280" y2="60" stroke="#c4f035" stroke-width="6" stroke-linecap="round"/>
        <line x1="70" y1="60" x2="70" y2="110" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
        <line x1="250" y1="60" x2="250" y2="110" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
        <ellipse cx="70" cy="120" rx="46" ry="12" fill="rgba(196,240,53,.14)" stroke="#c4f035" stroke-width="2"/>
        <text x="70" y="116" text-anchor="middle" font-size="34">🏋️</text>
        <ellipse cx="250" cy="120" rx="46" ry="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
        <text x="250" y="116" text-anchor="middle" font-size="30">🚗</text>
      </g>
      <line x1="160" y1="60" x2="160" y2="180" stroke="rgba(255,255,255,.3)" stroke-width="6" stroke-linecap="round"/>
      <path d="M120 180 H200 L186 196 H134 Z" fill="rgba(255,255,255,.12)"/>
    </svg>
  </div>
  <div class="cap">…a <b>small car.</b> 🚗</div>
  <div class="sub">4.2 t lifted · Push Day A</div>
  <div class="stats">
    <div class="s"><b>47</b><span>MIN</span></div>
    <div class="s"><b>18</b><span>SETS</span></div>
    <div class="s"><b>2 🏆</b><span>PRS</span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share this</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div>
<script>setTimeout(()=>{document.querySelector('.tip').style.transform='rotate(-9deg)';},50);</script>
</body></html>
