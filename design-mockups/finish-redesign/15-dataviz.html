<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Data Viz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{--ink:#0a0c0a;--lime:#c4f035;--blue:#7fd4e8;--chalk:#f4f6f2;--ash:#8b8f86;--line:#1e211e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:radial-gradient(120% 60% at 80% 0,#13170f,#080a08 55%)}
.wrap{position:absolute;inset:0;padding:54px 28px 26px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:.3em;font-size:15px}
.date{font-family:'JetBrains Mono';font-size:11px;color:var(--ash);letter-spacing:.08em}
.kick{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);margin-top:30px}
.h1{font-weight:900;font-size:30px;letter-spacing:-.03em;margin-top:6px}
.hero{margin-top:8px;display:flex;align-items:baseline;gap:10px}
.hero b{font-weight:900;font-size:76px;letter-spacing:-.04em;line-height:1}
.hero small{font-weight:700;font-size:24px;color:var(--ash)}
.hero .up{font-family:'JetBrains Mono';font-size:12px;color:#7fe0a0;background:rgba(127,224,160,.12);border:1px solid rgba(127,224,160,.3);padding:4px 9px;border-radius:999px;align-self:center}
.chart{flex:1;margin-top:18px;display:flex;align-items:flex-end;gap:9px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.bar{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#26301a,#1a2113);position:relative}
.bar.on{background:linear-gradient(180deg,#d6ff5e,var(--lime));box-shadow:0 0 24px -4px rgba(196,240,53,.6)}
.bar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:'JetBrains Mono';font-size:9px;color:var(--ash)}
.bar.on span{color:var(--lime)}
.axis{display:flex;gap:9px;margin-top:8px}
.axis div{flex:1;text-align:center;font-family:'JetBrains Mono';font-size:9px;color:var(--ash);letter-spacing:.04em}
.foot{display:flex;margin-top:18px;border-top:1px solid var(--line)}
.f{flex:1;padding:16px 2px;border-right:1px solid var(--line)}
.f:last-child{border-right:none}
.f b{display:block;font-weight:900;font-size:24px}
.f span{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-top:4px;display:block}
.share{width:100%;border:none;border-radius:14px;padding:16px;font-family:inherit;font-weight:800;font-size:16px;background:var(--lime);color:#06270a;cursor:pointer;margin-top:18px}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1px solid var(--line);background:transparent;border-radius:14px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--chalk);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--ash);padding:12px 0 0}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="top"><div class="logo">HYBRID</div><div class="date">22 JUN · 22:41</div></div>
  <div class="kick">Session complete</div>
  <div class="h1">Night workout</div>
  <div class="hero"><b>20.0</b><small>t volume</small><span class="up">▲ new high</span></div>
  <div class="chart">
    <div class="bar" style="height:34%"><span>9t</span></div>
    <div class="bar" style="height:50%"><span>13t</span></div>
    <div class="bar" style="height:42%"><span>11t</span></div>
    <div class="bar" style="height:64%"><span>16t</span></div>
    <div class="bar" style="height:55%"><span>14t</span></div>
    <div class="bar" style="height:70%"><span>17t</span></div>
    <div class="bar on" style="height:100%"><span>20t</span></div>
  </div>
  <div class="axis"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Tonight</div></div>
  <div class="foot">
    <div class="f"><b>1</b><span>Minutes</span></div>
    <div class="f"><b>2</b><span>Sets</span></div>
    <div class="f"><b>7</b><span>Day streak</span></div>
  </div>
  <button class="share">↗ Share to story</button>
  <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
