<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 18 Jumbotron</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{font-family:'Space Mono';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.board{width:100%;margin:14px 0;border-radius:18px;border:2px solid #1d231d;background:#05070500;padding:18px 0;overflow:hidden;
  background-image:radial-gradient(rgba(196,240,53,.10) 1.5px,transparent 1.6px);background-size:10px 10px}
.marquee{display:flex;white-space:nowrap;animation:scroll 12s linear infinite}
.marquee span{font-family:'Space Mono';font-weight:700;font-size:30px;color:var(--lime);text-shadow:0 0 14px rgba(196,240,53,.5);padding:0 16px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.big{font-size:96px;margin:8px 0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.punch{font-weight:900;font-size:30px;line-height:1.05}
.punch b{color:var(--lime)}
.sub{font-family:'Space Mono';font-size:12px;color:var(--ash);margin-top:10px}
.stats{display:flex;gap:18px;margin-top:16px;font-family:'Space Mono';font-size:12px;color:var(--ash)}
.stats b{color:var(--chalk);font-family:Archivo;font-size:18px;display:block}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.an{background:transparent;color:var(--chalk);border:1px solid var(--line);margin-top:16px;font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="tag">Push Day A · complete</div>
  <div class="board"><div class="marquee">
    <span>YOU LIFTED A SMALL CAR&nbsp;·&nbsp;4.2 t&nbsp;·&nbsp;</span>
    <span>YOU LIFTED A SMALL CAR&nbsp;·&nbsp;4.2 t&nbsp;·&nbsp;</span>
  </div></div>
  <div class="big">🚗</div>
  <div class="punch">4.2 t = one<br><b>small car.</b></div>
  <div class="sub">put that on the jumbotron</div>
  <div class="stats"><div><b>47'</b>time</div><div><b>18</b>sets</div><div><b>2🏆</b>prs</div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share the headline</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn an">See your analysis →</button>
</div></div></body></html>
