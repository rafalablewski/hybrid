<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 05 Liquid Glass</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--chalk:#f4f6f2;--ash:#aeb4ac;--lime:#c4f035}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000;
  background:radial-gradient(circle at 20% 10%,#1b3a2a,transparent 50%),radial-gradient(circle at 90% 30%,#243a66,transparent 55%),radial-gradient(circle at 50% 100%,#3a2a55,transparent 55%),#06080a}
.wrap{height:100%;overflow-y:auto;padding:60px 20px 24px;display:flex;flex-direction:column;align-items:center}
.glass{backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 50px -20px rgba(0,0,0,.6)}
.check{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:36px;color:var(--lime);margin-bottom:16px}
.h1{font-weight:900;font-size:27px;letter-spacing:-.02em}
.name{font-weight:600;font-size:17px;color:var(--ash);margin-top:4px;margin-bottom:22px}
.panel{width:100%;padding:20px;margin-bottom:14px}
.ey{font-family:'Space Mono';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.stat-row{display:flex;margin-top:14px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:28px;font-weight:900}
.stat span{font-family:'Space Mono';font-size:9px;color:var(--ash)}
.fun{display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;margin-bottom:14px}
.fun .emoji{font-size:40px}
.fun .txt{font-size:15px;line-height:1.35}
.fun .txt b{color:var(--lime)}
.spacer{flex:1}
.btn{width:100%;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;border:1px solid rgba(255,255,255,.18)}
.share{background:rgba(196,240,53,.9);color:#0a0c0a;border:none;box-shadow:0 8px 30px -6px rgba(196,240,53,.5)}
.ghost{background:rgba(255,255,255,.08);color:var(--chalk);margin-top:10px}
.analysis{background:transparent;color:var(--chalk);margin-top:18px;font-weight:600;opacity:.85}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="glass check">✓</div>
  <div class="h1">Workout complete</div>
  <div class="name">Push Day A</div>
  <div class="glass panel">
    <div class="ey">Overview</div>
    <div class="stat-row">
      <div class="stat"><b>47</b><span>MIN</span></div>
      <div class="stat"><b>18</b><span>SETS</span></div>
      <div class="stat"><b>4.2 t</b><span>VOLUME</span></div>
    </div>
  </div>
  <div class="glass fun"><div class="emoji">🚗</div><div class="txt">You moved <b>4.2&nbsp;t</b> — about a small car.</div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share your win</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
</div></div></body></html>
