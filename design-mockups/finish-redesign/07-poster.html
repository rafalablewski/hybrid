<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Poster</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{--ink:#0c0d0c;--ink2:#141614;--card:#161816;--line:#2a2d2a;--lime:#c4f035;--chalk:#f3f4ef;--ash:#8b8f86;--blue:#7fd4e8;--violet:#c9a9f0;--amber:#f0b45e;--red:#e0625e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Archivo',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
.phone{--fg:var(--chalk);width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;color:var(--fg);background:var(--ink)}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:40;font-family:'JetBrains Mono';font-size:14px;font-weight:500;color:var(--fg)}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--fg);opacity:.22;z-index:40}
.logo{font-weight:900;font-size:14px;letter-spacing:.3em}
.statlabel{font-family:'Archivo Narrow';font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);display:block;margin-top:4px}
.primary{width:100%;border:none;border-radius:14px;padding:16px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--lime);color:var(--ink)}
.srow{display:flex;gap:10px;margin-top:10px}
.srow button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:14px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
.done{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ash);font-family:'JetBrains Mono';font-size:12px;padding:14px 0 0;cursor:pointer}
/* —— poster layout —— */
.wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.head{padding:62px 28px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
.head .meta{font-family:'JetBrains Mono';font-size:10px;color:var(--ash);text-align:right;letter-spacing:.06em}
.hero{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 28px;overflow:hidden}
.watermark{position:absolute;right:-30px;top:50%;transform:translateY(-50%) rotate(90deg);font-weight:900;font-size:168px;color:rgba(196,240,53,.06);letter-spacing:-.05em;white-space:nowrap}
.kick{font-family:'Archivo Narrow';font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--lime)}
.big{font-weight:900;font-size:124px;line-height:.8;letter-spacing:-.05em;margin-top:10px}
.big small{font-weight:600;font-size:42px;color:var(--ash)}
.rule{height:3px;background:var(--lime);width:64px;margin:24px 0}
.body{font-size:16px;line-height:1.5;color:#c9ccc4;max-width:280px}
.body b{color:var(--chalk);font-weight:700}
.foot{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}
.stat{padding:18px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-weight:900;font-size:26px;letter-spacing:-.02em}
.acts{padding:18px 28px 30px;border-top:1px solid var(--line)}
</style></head>
<body><div class="phone">
  <div class="statusbar"><span class="time">22:41</span><span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div class="wrap">
    <div class="head"><div class="logo">HYBRID</div><div class="meta">VOL.1 · NO.22<br>22 JUN 2026</div></div>
    <div class="hero">
      <div class="watermark">HYBRID</div>
      <div class="kick">Session complete</div>
      <div class="big">20.0<small>t</small></div>
      <div class="rule"></div>
      <div class="body"><b>Night workout.</b> Twenty tonnes across two sets — about the weight of a humpback whale, and on the record.</div>
    </div>
    <div class="foot">
      <div class="stat"><b>1</b><span class="statlabel">Minutes</span></div>
      <div class="stat"><b>2</b><span class="statlabel">Sets</span></div>
      <div class="stat"><b>20.0t</b><span class="statlabel">Volume</span></div>
    </div>
    <div class="acts">
      <button class="primary">↗ Share to story</button>
      <div class="srow"><button>★ Save as routine</button><button>See analysis →</button></div>
      <button class="done">Done — back to Today</button>
    </div>
  </div>
  <div class="home"></div>
</div></body></html>
