name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client BEFORE typecheck so tsc can resolve
      # @prisma/client's generated types (PrismaClient, User, Role, model
      # delegates). Only `build` runs prisma generate, but typecheck runs first.
      - name: Generate Prisma client
        run: pnpm --filter @hybrid/web db:generate

      # tsc across @hybrid/core, @hybrid/web AND @hybrid/mobile — the mobile
      # typecheck is the gap Vercel's web-only build doesn't cover.
      - name: Typecheck
        run: pnpm typecheck

      # Unit + security tests: @hybrid/core engines + security primitives, and
      # the @hybrid/web static security scans (auth on every route, admin guard,
      # token redaction, headers, no committed secrets).
      - name: Test
        run: pnpm test

      # Surface high/critical CVEs in production dependencies. Non-blocking:
      # npm retired the audit-quick endpoint pnpm calls (HTTP 410 — "use the
      # bulk advisory endpoint"), so `pnpm audit` currently errors regardless of
      # findings and would red-fail every run. Dependabot (.github/dependabot.yml)
      # remains the enforced path for dependency fixes; re-block here once pnpm
      # targets npm's bulk endpoint.
      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod

      # iOS bundle export — proves the Expo app actually bundles (Metro
      # resolution, native-module + asset registration), which the type-only
      # check above can't see. No simulator needed.
      - name: Mobile iOS bundle
        run: pnpm --filter @hybrid/mobile export:ios
