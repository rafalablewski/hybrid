<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 03 Big Number</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--surface:#141814;--line:rgba(255,255,255,.1);--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:56px 22px 24px;display:flex;flex-direction:column}
.top{font-family:'Space Mono';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
.top b{color:var(--lime)}
.huge{font-weight:900;font-size:120px;line-height:.9;letter-spacing:-.05em;margin-top:18px;background:linear-gradient(180deg,#fff,#c4f035);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{font-size:34px;color:var(--ash);font-weight:800}
.lead{font-size:17px;color:var(--ash);margin-top:8px;max-width:78%}
.lead b{color:var(--chalk)}
.mini{display:flex;gap:10px;margin-top:26px}
.chip{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.chip b{display:block;font-size:22px;font-weight:900}
.chip span{font-family:'Space Mono';font-size:10px;color:var(--ash);letter-spacing:.08em}
.prbar{margin-top:18px;background:rgba(196,240,53,.08);border:1px solid rgba(196,240,53,.4);border-radius:16px;padding:14px 16px;font-size:14px}
.prbar b{color:var(--lime)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 .btn{flex:1}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.analysis{background:transparent;color:var(--chalk);border:1px solid var(--line);font-weight:600}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="top">Push Day A · <b>complete ✓</b></div>
  <div class="huge">4.2<span class="unit"> t</span></div>
  <div class="lead">moved today — about <b>a small car</b> 🚗</div>
  <div class="mini">
    <div class="chip"><b>47</b><span>MIN</span></div>
    <div class="chip"><b>18</b><span>SETS</span></div>
    <div class="chip"><b>2</b><span>PRS</span></div>
  </div>
  <div class="prbar">🏆 <b>Bench Press</b> +5 kg · ⭐ <b>OHP</b> first ever</div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share this</button>
  <div class="row2"><button class="btn ghost">★ Routine</button><button class="btn analysis">Analysis →</button></div>
</div></div></body></html>
