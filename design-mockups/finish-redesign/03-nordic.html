<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Nordic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--fog:#e7eaec;--snow:#f5f7f8;--card:#ffffff;--slate:#3c4248;--mist:#8a949b;--lime:#c4f035;--limeink:#5f7508;--frost:#cfd6da}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1b1f22;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--slate)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #2c3134;box-shadow:0 40px 120px -30px #000;
  background:linear-gradient(180deg,#eef1f2 0%,var(--fog) 100%)}
.wrap{height:100%;overflow-y:auto;padding:74px 26px 28px;display:flex;flex-direction:column}
.check{width:72px;height:72px;border-radius:24px;margin:0 auto;display:grid;place-items:center;background:var(--card);box-shadow:0 12px 28px -12px rgba(60,66,72,.35);font-size:30px;color:var(--limeink)}
.h1{text-align:center;font-weight:700;font-size:30px;letter-spacing:-.02em;margin-top:22px}
.name{text-align:center;font-size:15px;color:var(--mist);margin-top:8px}
.rename{margin:20px auto 0;max-width:260px;background:var(--card);border-radius:16px;padding:13px 16px;font-size:13px;color:var(--mist);text-align:center;box-shadow:0 8px 20px -14px rgba(60,66,72,.4)}
.card{margin-top:22px;background:var(--card);border-radius:26px;padding:24px;box-shadow:0 18px 40px -20px rgba(60,66,72,.45)}
.ey{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
.stat-row{display:flex;margin-top:20px;gap:10px}
.stat{flex:1;text-align:center;background:var(--snow);border-radius:18px;padding:18px 6px}
.stat b{display:block;font-size:30px;font-weight:700;color:var(--slate)}
.stat span{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;color:var(--mist)}
.stat.acc{background:rgba(196,240,53,.22)}
.dots{display:flex;justify-content:center;gap:7px;margin:22px 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--frost)}
.dot.on{width:22px;background:var(--limeink);opacity:.5}
.spacer{flex:1;min-height:6px}
.btn{width:100%;border:none;border-radius:18px;padding:17px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.share{background:var(--lime);color:#33400a;box-shadow:0 14px 30px -12px rgba(196,240,53,.7)}
.ghost{background:var(--card);color:var(--slate);margin-top:11px;box-shadow:0 10px 24px -16px rgba(60,66,72,.5)}
.analysis{background:transparent;color:var(--mist);margin-top:14px;font-weight:600;font-size:14px}
.back{text-align:center;color:var(--mist);font-family:'JetBrains Mono';font-size:12px;padding:14px 0 2px}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="check">✓</div>
  <div class="h1">Session complete</div>
  <div class="name">Night workout</div>
  <div class="rename">✎ Name this workout (optional)</div>
  <div class="card">
    <div class="ey">Overview</div>
    <div class="stat-row">
      <div class="stat"><b>1</b><span>MINUTES</span></div>
      <div class="stat"><b>2</b><span>SETS</span></div>
      <div class="stat acc"><b>20.0</b><span>VOLUME · t</span></div>
    </div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share to story</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
  <div class="back">Done — back to Today</div>
</div></div></body></html>
