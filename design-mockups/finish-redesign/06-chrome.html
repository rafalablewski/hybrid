<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Chrome</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap');
:root{--lime:#c4f035;--chalk:#f4f6f2;--ash:#9aa09a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;
  background:radial-gradient(120% 80% at 50% 0%,#1c2420 0%,#0c0f0c 55%,#070807 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.6}
.b1{top:-40px;left:-30px;width:260px;height:260px;background:#c4f035}
.b2{top:180px;right:-60px;width:220px;height:220px;background:#7fd4e8}
.b3{bottom:120px;left:-40px;width:240px;height:240px;background:#c9a9f0}
.wrap{position:absolute;inset:0;padding:56px 30px 26px;display:flex;flex-direction:column;backdrop-filter:saturate(120%)}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:.3em;font-size:15px}
.badge{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;color:#06270a;background:var(--lime);padding:6px 11px;border-radius:999px;font-weight:600}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.kick{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--ash)}
.chrome{font-weight:900;font-size:138px;line-height:.82;letter-spacing:-.05em;margin-top:10px;
  background:linear-gradient(180deg,#ffffff 0%,#c4f035 30%,#5f7a14 52%,#eafabf 58%,#7fd4e8 80%,#3a7f92 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 24px rgba(196,240,53,.35))}
.unit{font-weight:700;font-size:34px;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff,#9aa09a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-weight:800;font-size:22px;margin-top:18px;letter-spacing:-.01em}
.sub b{color:var(--lime)}
.pills{display:flex;gap:8px;margin-top:18px}
.pill{font-family:'JetBrains Mono';font-size:12px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);padding:8px 13px;border-radius:999px}
.pill b{color:var(--lime)}
.acts{margin-top:8px}
.share{width:100%;border:none;border-radius:999px;padding:18px;font-family:inherit;font-weight:900;font-size:16px;color:#06270a;cursor:pointer;
  background:linear-gradient(180deg,#eaffb0,#c4f035);box-shadow:0 16px 42px -10px rgba(196,240,53,.6)}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:999px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;color:var(--chalk);cursor:pointer}
.back{text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--ash);padding:14px 0 0}
</style></head>
<body><div class="phone">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="badge">✓ Complete</div></div>
    <div class="mid">
      <div class="kick">You moved</div>
      <div class="chrome">20<span class="unit">.0t</span></div>
      <div class="sub">A <b>20-tonne</b> night.</div>
      <div class="pills"><span class="pill"><b>1</b> min</span><span class="pill"><b>2</b> sets</span><span class="pill"><b>20.0t</b> vol</span></div>
    </div>
    <div class="acts">
      <button class="share">↗ Share to story</button>
      <div class="row"><button>★ Save as routine</button><button>See analysis →</button></div>
    </div>
    <div class="back">Done — back to Today</div>
  </div>
</div></body></html>
