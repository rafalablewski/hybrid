<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · Tesla</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Archivo+Narrow:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--ink:#0a0a0a;--panel:#121313;--line:#222423;--steel:#3a3d3c;--chalk:#eef0ee;--ash:#7b7e7b;--lime:#c4f035}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;display:flex;flex-direction:column;padding:58px 0 22px}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 26px 20px}
.top .b{font-family:'Archivo Narrow';font-weight:600;letter-spacing:.42em;font-size:13px;text-transform:uppercase}
.top .s{font-family:'JetBrains Mono';font-size:11px;color:var(--lime);display:flex;align-items:center;gap:7px}
.top .s i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.hr{height:1px;background:var(--line)}
.statusrow{padding:30px 26px;text-align:center}
.statusrow .lab{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ash)}
.statusrow .h1{font-weight:300;font-size:32px;letter-spacing:.02em;margin-top:10px}
.statusrow .h1 b{font-weight:600}
.statusrow .name{font-family:'JetBrains Mono';font-size:12px;color:var(--ash);margin-top:10px;letter-spacing:.06em}
.gauge{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 26px}
.big{font-weight:300;font-size:96px;letter-spacing:-.04em;line-height:1}
.big b{font-weight:600;color:var(--lime)}
.big small{font-weight:400;font-size:24px;color:var(--ash)}
.subgauge{display:flex;width:100%;margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sg{flex:1;text-align:center;padding:18px 0;border-right:1px solid var(--line)}
.sg:last-child{border-right:none}
.sg b{font-weight:500;font-size:24px}
.sg span{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.16em;color:var(--ash);margin-top:6px}
.dots{display:flex;justify-content:center;gap:8px;padding:22px}
.dot{width:24px;height:3px;background:var(--steel)}
.dot.on{background:var(--lime)}
.acts{padding:0 22px}
.btn{width:100%;border:1px solid var(--steel);background:transparent;border-radius:8px;padding:15px;font-family:'Archivo Narrow';font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;color:var(--chalk);margin-top:10px}
.share{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.back{text-align:center;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);padding:18px 0 2px}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="top"><div class="b">HYBRID</div><div class="s"><i></i>SESSION COMPLETE</div></div>
  <div class="hr"></div>
  <div class="statusrow">
    <div class="lab">Session report</div>
    <div class="h1">Night <b>workout</b></div>
    <div class="name">✎ name this workout (optional)</div>
  </div>
  <div class="gauge">
    <div class="big"><b>20.0</b><small> t</small></div>
    <div class="subgauge">
      <div class="sg"><b>1</b><span>MINUTES</span></div>
      <div class="sg"><b>2</b><span>SETS</span></div>
      <div class="sg"><b>20.0</b><span>TONNES</span></div>
    </div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="acts">
    <button class="btn share">↗ Share to story</button>
    <button class="btn">★ Save as routine</button>
    <button class="btn">See your analysis →</button>
  </div>
  <div class="back">Done — back to today</div>
</div></div></body></html>
