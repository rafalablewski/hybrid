<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish · 09 Activity Rings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#0a0c0a;--surface:#141814;--chalk:#f1f3ef;--ash:#8b918a;--lime:#c4f035;--blue:#5aa7ff;--violet:#b79cff;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Archivo,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;color:var(--chalk)}
.phone{width:390px;height:844px;background:var(--ink);border-radius:44px;overflow:hidden;position:relative;border:1px solid #222;box-shadow:0 40px 120px -30px #000}
.wrap{height:100%;overflow-y:auto;padding:54px 22px 24px;display:flex;flex-direction:column;align-items:center}
.h1{font-weight:900;font-size:26px;letter-spacing:-.02em}
.name{font-weight:600;color:var(--ash);font-size:15px;margin:2px 0 14px}
svg{width:230px;height:230px}
.legend{display:flex;gap:16px;margin-top:14px}
.lg{display:flex;align-items:center;gap:6px;font-family:'Space Mono';font-size:11px;color:var(--ash)}
.lg b{color:var(--chalk);font-family:Archivo}
.swatch{width:10px;height:10px;border-radius:3px}
.fun{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:18px}
.fun .e{font-size:34px}.fun .t{font-size:14px;line-height:1.35}.fun .t b{color:var(--lime)}
.pr{margin-top:12px;width:100%;display:flex;gap:8px}
.prc{flex:1;background:rgba(196,240,53,.08);border:1px solid rgba(196,240,53,.35);border-radius:14px;padding:10px;font-size:12px;text-align:center}
.prc b{color:var(--lime)}
.spacer{flex:1}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.share{background:var(--lime);color:var(--ink);box-shadow:0 0 26px -4px rgba(196,240,53,.6)}
.ghost{background:transparent;color:var(--lime);border:1px solid rgba(196,240,53,.4)}
.analysis{background:transparent;color:var(--chalk);border:1px solid var(--line);font-weight:600;margin-top:18px}
</style></head>
<body><div class="phone"><div class="wrap">
  <div class="h1">Workout complete ✓</div>
  <div class="name">Push Day A</div>
  <svg viewBox="0 0 200 200">
    <g fill="none" stroke-linecap="round" transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="86" stroke="#1f2a1f" stroke-width="16"/>
      <circle cx="100" cy="100" r="86" stroke="#c4f035" stroke-width="16" stroke-dasharray="540" stroke-dashoffset="70"/>
      <circle cx="100" cy="100" r="64" stroke="#16263b" stroke-width="16"/>
      <circle cx="100" cy="100" r="64" stroke="#5aa7ff" stroke-width="16" stroke-dasharray="402" stroke-dashoffset="90"/>
      <circle cx="100" cy="100" r="42" stroke="#241d38" stroke-width="16"/>
      <circle cx="100" cy="100" r="42" stroke="#b79cff" stroke-width="16" stroke-dasharray="264" stroke-dashoffset="40"/>
    </g>
    <text x="100" y="96" text-anchor="middle" fill="#f1f3ef" font-family="Archivo" font-weight="900" font-size="30">4.2t</text>
    <text x="100" y="116" text-anchor="middle" fill="#8b918a" font-family="Space Mono" font-size="10">VOLUME</text>
  </svg>
  <div class="legend">
    <div class="lg"><span class="swatch" style="background:#c4f035"></span>Volume <b>4.2t</b></div>
    <div class="lg"><span class="swatch" style="background:#5aa7ff"></span>Sets <b>18</b></div>
    <div class="lg"><span class="swatch" style="background:#b79cff"></span>Time <b>47'</b></div>
  </div>
  <div class="pr"><div class="prc">🏆 <b>Bench</b> +5kg</div><div class="prc">⭐ <b>OHP</b> first</div></div>
  <div class="fun"><div class="e">🚗</div><div class="t">You moved <b>4.2 t</b> — about a small car.</div></div>
  <div class="spacer"></div>
  <button class="btn share">↗ Share your rings</button>
  <button class="btn ghost">★ Save as routine</button>
  <button class="btn analysis">See your analysis →</button>
</div></div></body></html>
