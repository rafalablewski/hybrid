<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share · Athletic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{--ink:#0c0d0c;--ink2:#141614;--card:#161816;--line:#2a2d2a;--lime:#c4f035;--chalk:#f3f4ef;--ash:#8b8f86;--blue:#7fd4e8;--violet:#c9a9f0;--amber:#f0b45e;--red:#e0625e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Archivo',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
.phone{--fg:var(--chalk);width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;border:1px solid #1c1c1c;box-shadow:0 50px 130px -30px #000;color:var(--fg);background:#070808}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:40;font-family:'JetBrains Mono';font-size:14px;font-weight:500;color:var(--fg)}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--fg);opacity:.22;z-index:40}
.logo{font-weight:900;font-size:14px;letter-spacing:.3em}
.statlabel{font-family:'Archivo Narrow';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);display:block;margin-top:5px}
.actions{margin-top:auto}
.primary{width:100%;border:none;border-radius:16px;padding:16px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--lime);color:var(--ink);box-shadow:0 14px 36px -12px rgba(196,240,53,.45)}
.srow{display:flex;gap:10px;margin-top:10px}
.srow button{flex:1;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--fg);border-radius:16px;padding:13px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
.done{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ash);font-family:'JetBrains Mono';font-size:12px;padding:15px 0 0;cursor:pointer}
/* —— athletic art —— */
.phone{background:radial-gradient(80% 50% at 70% 16%,rgba(196,240,53,.2),transparent 60%),linear-gradient(180deg,#10130f 0%,#0a0c0a 42%,#060706 100%)}
.lines{position:absolute;inset:0;opacity:.6}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 26%,transparent 52%,rgba(0,0,0,.8) 100%)}
.wrap{position:absolute;inset:0;padding:64px 28px 30px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.live{font-family:'JetBrains Mono';font-size:11px;color:var(--lime);display:flex;align-items:center;gap:7px;letter-spacing:.12em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.spacer{flex:1}
.kind{font-family:'Archivo Narrow';font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
.h1{font-weight:900;font-size:40px;letter-spacing:-.03em;margin-top:6px}
.meta{font-family:'JetBrains Mono';font-size:12px;color:var(--ash);margin-top:8px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:24px;border-top:1px solid rgba(255,255,255,.16)}
.stat{padding:18px 4px;border-right:1px solid rgba(255,255,255,.12)}
.stat:last-child{border-right:none}
.stat b{display:block;font-weight:900;font-size:32px;letter-spacing:-.03em}
.stat b small{font-size:15px;color:var(--ash);font-weight:600}
.actions{margin-top:22px}
</style></head>
<body><div class="phone">
  <div class="lines"><svg viewBox="0 0 390 844" preserveAspectRatio="none" width="100%" height="100%">
    <polyline points="-10,300 60,250 120,280 180,200 250,240 320,160 400,210" fill="none" stroke="rgba(196,240,53,.5)" stroke-width="2"/>
    <polyline points="-10,360 70,330 140,350 210,300 290,330 360,280 400,300" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
  </svg></div>
  <div class="veil"></div>
  <div class="statusbar"><span class="time">22:41</span><span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div class="wrap">
    <div class="top"><div class="logo">HYBRID</div><div class="live"><i></i>SESSION COMPLETE</div></div>
    <div class="spacer"></div>
    <div class="kind">Strength · PR effort</div>
    <div class="h1">Night workout</div>
    <div class="meta">22 JUN 2026 · 22:41</div>
    <div class="stats">
      <div class="stat"><b>1<small>m</small></b><span class="statlabel">Duration</span></div>
      <div class="stat"><b>2</b><span class="statlabel">Sets</span></div>
      <div class="stat"><b>20.0<small>t</small></b><span class="statlabel">Volume</span></div>
    </div>
    <div class="actions">
      <button class="primary">↗ Share to story</button>
      <div class="srow"><button>★ Save as routine</button><button>See analysis →</button></div>
      <button class="done">Done — back to Today</button>
    </div>
  </div>
  <div class="home"></div>
</div></body></html>
